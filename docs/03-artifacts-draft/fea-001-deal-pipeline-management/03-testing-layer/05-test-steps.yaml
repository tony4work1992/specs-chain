# FEA-001 — Test Steps
# Concrete sequential execution steps per Test Case.
# Structure: TES-XXXXXX > CAS-XXXXXX > [STE-XXXXXX, ...]
# Each step: action -> precondition/input -> expected output

requestVersion: "2026.04.06 21.00.00"
version: "2026.04.06 21.00.00"
parentVersion: "2026.04.06 21.00.00"

TES-000001:
  # Suite: Create Deal — Happy Path (CAS-000001)
  CAS-000001:
    - id: "ste-0001-0001-4000-a000-000000000001"
      stepNumber: STE-000001
      description: "Precondition: Seed DB with 1 Contact (id=CONTACT_UUID_1) and 1 active SALES_REP (id=REP_UUID_1). Seed pipeline_stages with 6 rows ordered 1–6. Authenticate as SALES_MANAGER and obtain JWT_MANAGER."
      expectedResults:
        - id: 1
          description: "DB has contacts row with id=CONTACT_UUID_1."
        - id: 2
          description: "DB has users row with id=REP_UUID_1, role=SALES_REP, status=ACTIVE."
        - id: 3
          description: "pipeline_stages table has 6 rows with orders 1–6."
        - id: 4
          description: "JWT_MANAGER is a valid signed token with role=SALES_MANAGER."

    - id: "ste-0001-0001-4000-a000-000000000002"
      stepNumber: STE-000002
      description: "Send POST /deals with Authorization: Bearer JWT_MANAGER and body: { title: 'Acme Q1 Deal', contact_id: CONTACT_UUID_1, value: 25000, currency: 'USD', expected_close_date: '2026-07-01', assigned_rep_id: REP_UUID_1, source: 'Referral', description: 'High priority deal' }. Target: POST /deals controller → CreateDealUseCase."
      expectedResults:
        - id: 1
          description: "HTTP 201 Created."
        - id: 2
          description: "Response body: DealResponseDto with id matching UUID v4 pattern."
        - id: 3
          description: "Response body: current_stage.name = 'New', current_stage.order = 1."
        - id: 4
          description: "Response body: value = 25000, title = 'Acme Q1 Deal'."

    - id: "ste-0001-0001-4000-a000-000000000003"
      stepNumber: STE-000003
      description: "Query DB: SELECT * FROM deals WHERE title='Acme Q1 Deal'. Target: deals table (TypeORM DealEntity)."
      expectedResults:
        - id: 1
          description: "1 row returned with id=UUID (not integer)."
        - id: 2
          description: "current_stage_id = id of pipeline_stages row with order=1 (New)."
        - id: 3
          description: "deleted_at IS NULL (not archived)."
        - id: 4
          description: "assigned_rep_id = REP_UUID_1."

    - id: "ste-0001-0001-4000-a000-000000000004"
      stepNumber: STE-000004
      description: "Query DB: SELECT * FROM deal_stage_transitions WHERE deal_id=<new_deal_id>. Target: deal_stage_transitions table."
      expectedResults:
        - id: 1
          description: "0 rows returned (no transition on initial creation — deal starts at stage 1 with no prior stage)."

TES-000002:
  # Suite: Stage Transition — Happy Path + Transaction Atomicity (CAS-000015 + CAS-000020)
  CAS-000015:
    - id: "ste-0002-0015-4000-a000-000000000001"
      stepNumber: STE-000005
      description: "Precondition: Seed deal DEAL_UUID_1 in 'New' stage (current_stage_id=NEW_STAGE_UUID). Authenticate as deal owner REP_UUID_1 to get JWT_REP_1."
      expectedResults:
        - id: 1
          description: "deals row exists: id=DEAL_UUID_1, current_stage_id=NEW_STAGE_UUID, assigned_rep_id=REP_UUID_1."
        - id: 2
          description: "JWT_REP_1 is valid with userId=REP_UUID_1, role=SALES_REP."

    - id: "ste-0002-0015-4000-a000-000000000002"
      stepNumber: STE-000006
      description: "Send PATCH /deals/DEAL_UUID_1/stage with Authorization: Bearer JWT_REP_1 and body: { target_stage_id: QUALIFIED_STAGE_UUID }. Target: PATCH /deals/:id/stage → TransitionDealStageUseCase → DB transaction."
      expectedResults:
        - id: 1
          description: "HTTP 200 OK."
        - id: 2
          description: "Response body: DealResponseDto with current_stage.name='Qualified', current_stage.order=2."
        - id: 3
          description: "Response time < 800ms."

    - id: "ste-0002-0015-4000-a000-000000000003"
      stepNumber: STE-000007
      description: "Query DB: SELECT current_stage_id, stage_entered_at FROM deals WHERE id=DEAL_UUID_1. Target: deals table."
      expectedResults:
        - id: 1
          description: "current_stage_id = QUALIFIED_STAGE_UUID."
        - id: 2
          description: "stage_entered_at is approximately NOW() (within 5 seconds of test execution time)."

    - id: "ste-0002-0015-4000-a000-000000000004"
      stepNumber: STE-000008
      description: "Query DB: SELECT * FROM deal_stage_transitions WHERE deal_id=DEAL_UUID_1. Target: deal_stage_transitions table."
      expectedResults:
        - id: 1
          description: "Exactly 1 row returned."
        - id: 2
          description: "from_stage_id = NEW_STAGE_UUID."
        - id: 3
          description: "to_stage_id = QUALIFIED_STAGE_UUID."
        - id: 4
          description: "transitioned_by_user_id = REP_UUID_1."
        - id: 5
          description: "transitioned_at is approximately NOW()."

    - id: "ste-0002-0015-4000-a000-000000000005"
      stepNumber: STE-000009
      description: "Verify Redis cache invalidation: Query Redis GET pipeline:summary:{MANAGER_UUID}. Target: Redis (PipelineSummaryCacheRepository)."
      expectedResults:
        - id: 1
          description: "Key pipeline:summary:{MANAGER_UUID} does NOT exist (was deleted by CacheInvalidationService)."

  CAS-000020:
    - id: "ste-0002-0020-4000-a000-000000000001"
      stepNumber: STE-000010
      description: "Precondition: Seed deal DEAL_UUID_2 in 'New' stage. Inject fault: configure test DB transaction interceptor to throw ConstraintViolationException after the UPDATE to deals.current_stage_id but before the INSERT to deal_stage_transitions."
      expectedResults:
        - id: 1
          description: "Fault injection is active for this test only."
        - id: 2
          description: "deals row DEAL_UUID_2 exists with current_stage_id=NEW_STAGE_UUID."

    - id: "ste-0002-0020-4000-a000-000000000002"
      stepNumber: STE-000011
      description: "Send PATCH /deals/DEAL_UUID_2/stage with { target_stage_id: QUALIFIED_STAGE_UUID }. Target: TransitionDealStageUseCase → DataSource transaction."
      expectedResults:
        - id: 1
          description: "HTTP 500 or HTTP 503 returned (transaction failure propagated)."
        - id: 2
          description: "Response body contains an error message (not empty body)."

    - id: "ste-0002-0020-4000-a000-000000000003"
      stepNumber: STE-000012
      description: "Query DB: SELECT current_stage_id FROM deals WHERE id=DEAL_UUID_2. Target: deals table."
      expectedResults:
        - id: 1
          description: "current_stage_id = NEW_STAGE_UUID (unchanged — full rollback occurred)."

    - id: "ste-0002-0020-4000-a000-000000000004"
      stepNumber: STE-000013
      description: "Query DB: SELECT COUNT(*) FROM deal_stage_transitions WHERE deal_id=DEAL_UUID_2. Target: deal_stage_transitions table."
      expectedResults:
        - id: 1
          description: "COUNT = 0 (no transition record was committed)."

TES-000003:
  # Suite: Stage Transition — Invalid (CAS-000017 skip, CAS-000018 backward, CAS-000019 terminal)
  CAS-000017:
    - id: "ste-0003-0017-4000-a000-000000000001"
      stepNumber: STE-000014
      description: "Precondition: Seed deal DEAL_UUID_3 in 'New' stage (order=1). Authenticated as deal owner."
      expectedResults:
        - id: 1
          description: "Deal exists in New stage. current_stage.order = 1."

    - id: "ste-0003-0017-4000-a000-000000000002"
      stepNumber: STE-000015
      description: "Send PATCH /deals/DEAL_UUID_3/stage with { target_stage_id: PROPOSAL_SENT_UUID } (order=3, skipping Qualified order=2). Target: TransitionDealStageUseCase → sequential order validation."
      expectedResults:
        - id: 1
          description: "HTTP 400 Bad Request."
        - id: 2
          description: "Response body: { error: 'INVALID_STAGE_TRANSITION', message: 'Target stage must be the next sequential stage or Closed Lost.' }."

    - id: "ste-0003-0017-4000-a000-000000000003"
      stepNumber: STE-000016
      description: "Query DB: SELECT current_stage_id FROM deals WHERE id=DEAL_UUID_3. Target: deals table."
      expectedResults:
        - id: 1
          description: "current_stage_id = NEW_STAGE_UUID (unchanged)."

    - id: "ste-0003-0017-4000-a000-000000000004"
      stepNumber: STE-000017
      description: "Query DB: SELECT COUNT(*) FROM deal_stage_transitions WHERE deal_id=DEAL_UUID_3."
      expectedResults:
        - id: 1
          description: "COUNT = 0 (no transition record written on rejection)."

  CAS-000019:
    - id: "ste-0003-0019-4000-a000-000000000001"
      stepNumber: STE-000018
      description: "Precondition: Seed deal DEAL_UUID_4. Transition it to Closed Won (current_stage.is_terminal=true, is_won=true). Verify closed_at IS NOT NULL in DB."
      expectedResults:
        - id: 1
          description: "deals row: current_stage_id=CLOSED_WON_UUID, closed_at IS NOT NULL."

    - id: "ste-0003-0019-4000-a000-000000000002"
      stepNumber: STE-000019
      description: "Send PATCH /deals/DEAL_UUID_4/stage with { target_stage_id: CLOSED_LOST_UUID }. Target: TransitionDealStageUseCase → is_terminal check."
      expectedResults:
        - id: 1
          description: "HTTP 400 Bad Request."
        - id: 2
          description: "Response body: { error: 'DEAL_STAGE_TERMINAL', message: 'Cannot transition a deal that is already in a terminal stage.' }."

    - id: "ste-0003-0019-4000-a000-000000000003"
      stepNumber: STE-000020
      description: "Send PATCH /deals/DEAL_UUID_4 with { value: 99000 }. Target: UpdateDealUseCase → terminal check."
      expectedResults:
        - id: 1
          description: "HTTP 400 Bad Request."
        - id: 2
          description: "Response body: { error: 'DEAL_STAGE_TERMINAL', message: 'Cannot update a deal in a terminal stage.' }."

    - id: "ste-0003-0019-4000-a000-000000000004"
      stepNumber: STE-000021
      description: "Query DB: SELECT value, current_stage_id FROM deals WHERE id=DEAL_UUID_4."
      expectedResults:
        - id: 1
          description: "value is unchanged from original (99000 was NOT applied)."
        - id: 2
          description: "current_stage_id = CLOSED_WON_UUID (not changed to Closed Lost)."

TES-000004:
  # Suite: RBAC — OwnershipGuard + RolesGuard (CAS-000014 + CAS-000032)
  CAS-000014:
    - id: "ste-0004-0014-4000-a000-000000000001"
      stepNumber: STE-000022
      description: "Precondition: Create REP_A (JWT_REP_A) and REP_B (JWT_REP_B). Seed DEAL_A owned by REP_A."
      expectedResults:
        - id: 1
          description: "deals row DEAL_A: assigned_rep_id=REP_A_UUID."
        - id: 2
          description: "JWT_REP_A: userId=REP_A_UUID, role=SALES_REP."
        - id: 3
          description: "JWT_REP_B: userId=REP_B_UUID, role=SALES_REP."

    - id: "ste-0004-0014-4000-a000-000000000002"
      stepNumber: STE-000023
      description: "Send PATCH /deals/DEAL_A_UUID with Authorization: Bearer JWT_REP_B and body { value: 99999 }. Target: OwnershipGuard → checks deal.assigned_rep_id vs JWT userId."
      expectedResults:
        - id: 1
          description: "HTTP 403 Forbidden."
        - id: 2
          description: "Response body: { error: 'DEAL_ACCESS_FORBIDDEN', message: 'You do not have permission to access this deal.' }."
        - id: 3
          description: "DB: deals.value is unchanged (REP_B's update was rejected before reaching UseCase)."

    - id: "ste-0004-0014-4000-a000-000000000003"
      stepNumber: STE-000024
      description: "Send same PATCH /deals/DEAL_A_UUID with Authorization: Bearer JWT_MANAGER and body { value: 99999 }. Target: OwnershipGuard bypass for SALES_MANAGER role."
      expectedResults:
        - id: 1
          description: "HTTP 200 OK."
        - id: 2
          description: "DB: deals.value = 99999 (update applied)."

  CAS-000032:
    - id: "ste-0004-0032-4000-a000-000000000001"
      stepNumber: STE-000025
      description: "Send GET /deals/summary with Authorization: Bearer JWT_REP_A (SALES_REP). Target: RolesGuard on GetPipelineSummary endpoint."
      expectedResults:
        - id: 1
          description: "HTTP 403 Forbidden."
        - id: 2
          description: "Response body does NOT contain any summary metric fields (total_active_deals, win_rate_30d, etc.)."

    - id: "ste-0004-0032-4000-a000-000000000002"
      stepNumber: STE-000026
      description: "Send GET /deals/summary with Authorization: Bearer JWT_MANAGER (SALES_MANAGER). Target: RolesGuard bypass + GetPipelineSummaryQueryHandler."
      expectedResults:
        - id: 1
          description: "HTTP 200 OK."
        - id: 2
          description: "Response body contains: total_active_deals (integer ≥ 0), total_value (number), win_rate_30d (number 0–100), avg_cycle_time_30d (number ≥ 0)."

TES-000005:
  # Suite: CSV Export (CAS-000033 sync + CAS-000034 async + CAS-000035 limit)
  CAS-000033:
    - id: "ste-0005-0033-4000-a000-000000000001"
      stepNumber: STE-000027
      description: "Precondition: Seed exactly 100 deals (all active, no filter needed). Authenticate as SALES_MANAGER."
      expectedResults:
        - id: 1
          description: "100 active deals in DB."
        - id: 2
          description: "JWT_MANAGER is valid."

    - id: "ste-0005-0033-4000-a000-000000000002"
      stepNumber: STE-000028
      description: "Send POST /deals/export with Authorization: Bearer JWT_MANAGER and empty body (no filter — all 100 deals). Target: ExportDealsCommand → synchronous path (count ≤ 500)."
      expectedResults:
        - id: 1
          description: "HTTP 200 OK."
        - id: 2
          description: "Response header Content-Type = 'text/csv'."
        - id: 3
          description: "Response header Content-Disposition contains 'attachment' and a .csv filename."
        - id: 4
          description: "Response body is non-empty CSV text."

    - id: "ste-0005-0033-4000-a000-000000000003"
      stepNumber: STE-000029
      description: "Parse response CSV body: split by newline. Target: CSV output validation."
      expectedResults:
