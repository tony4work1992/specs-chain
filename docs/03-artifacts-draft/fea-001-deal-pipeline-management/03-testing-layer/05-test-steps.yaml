          description: "First row (header row) contains column names matching DealListItemDto: id, title, contact_name, company_name, assigned_rep_name, stage_name, value, currency, expected_close_date, days_open, last_activity_date."
        - id: 2
          description: "Total data rows (excluding header) = 100."
        - id: 3
          description: "No empty rows within the 100 data rows."

  CAS-000034:
    - id: "ste-0005-0034-4000-a000-000000000001"
      stepNumber: STE-000030
      description: "Precondition: Seed 600 active deals. Bull queue worker is running. S3Client mock returns success. JWT_MANAGER authenticated."
      expectedResults:
        - id: 1
          description: "600 deals in DB."
        - id: 2
          description: "Bull 'deal-exports' queue is active."

    - id: "ste-0005-0034-4000-a000-000000000002"
      stepNumber: STE-000031
      description: "Send POST /deals/export with JWT_MANAGER and empty body. Record request start time. Target: ExportDealsController → Bull dispatch path (count > 500)."
      expectedResults:
        - id: 1
          description: "HTTP 202 Accepted."
        - id: 2
          description: "Response body: { job_id: <UUID v4 string> }."
        - id: 3
          description: "Total response time < 500ms (controller returns before job completes)."

    - id: "ste-0005-0034-4000-a000-000000000003"
      stepNumber: STE-000032
      description: "Wait for Bull job to complete (poll job status or use Bull job.finished() promise). Target: Bull queue 'deal-exports' worker → ExportDealsCommand execution."
      expectedResults:
        - id: 1
          description: "Bull job status = 'completed' (not 'failed' or 'stalled')."

    - id: "ste-0005-0034-4000-a000-000000000004"
      stepNumber: STE-000033
      description: "Query Redis: GET deal_export:{job_id}. Target: Redis key written by ExportDealsCommand after S3 upload."
      expectedResults:
        - id: 1
          description: "Key exists (not null)."
        - id: 2
          description: "Value is a string starting with 'https://' (pre-signed S3 URL)."
        - id: 3
          description: "URL contains S3 bucket name and expiry parameter (X-Amz-Expires)."

  CAS-000035:
    - id: "ste-0005-0035-4000-a000-000000000001"
      stepNumber: STE-000034
      description: "Precondition: Seed 1001 active deals. JWT_MANAGER authenticated."
      expectedResults:
        - id: 1
          description: "1001 deals in DB (SELECT COUNT(*) FROM deals WHERE deleted_at IS NULL = 1001)."

    - id: "ste-0005-0035-4000-a000-000000000002"
      stepNumber: STE-000035
      description: "Send POST /deals/export with JWT_MANAGER and empty body (no filter, returns all 1001). Target: ExportDealsCommand → row count check before CSV generation."
      expectedResults:
        - id: 1
          description: "HTTP 422 Unprocessable Entity."
        - id: 2
          description: "Response body: { error: 'EXPORT_LIMIT_EXCEEDED', actual_count: 1001, limit: 1000, message: 'Export exceeds 1000 row limit. Please apply filters to narrow the results.' }."
        - id: 3
          description: "No CSV content in response body."
        - id: 4
          description: "No Bull job enqueued (verify Bull queue length unchanged)."

TES-000006:
  # Suite: Cache-Aside Pattern (CAS-000030 + CAS-000031)
  CAS-000030:
    - id: "ste-0006-0030-4000-a000-000000000001"
      stepNumber: STE-000036
      description: "Precondition: Flush Redis (FLUSHDB on test Redis instance). Seed 50 active deals. Authenticate as SALES_MANAGER (JWT_MANAGER). Spy on IDealRepository aggregate query execution."
      expectedResults:
        - id: 1
          description: "Redis is empty — no pipeline:summary key exists."
        - id: 2
          description: "50 active deals in DB."

    - id: "ste-0006-0030-4000-a000-000000000002"
      stepNumber: STE-000037
      description: "Send GET /deals/summary with JWT_MANAGER (first call — cache miss). Target: GetPipelineSummaryQueryHandler → Redis GET (miss) → DB aggregate → Redis SET."
      expectedResults:
        - id: 1
          description: "HTTP 200 OK."
        - id: 2
          description: "IDealRepository aggregate query was called (spy count = 1)."
        - id: 3
          description: "Response: total_active_deals = 50."
        - id: 4
          description: "Response: all metrics are non-null numbers."

    - id: "ste-0006-0030-4000-a000-000000000003"
      stepNumber: STE-000038
      description: "Query Redis: GET pipeline:summary:{MANAGER_UUID}. Target: Redis key written after cache miss."
      expectedResults:
        - id: 1
          description: "Key exists."
        - id: 2
          description: "Value is valid JSON containing total_active_deals=50."
        - id: 3
          description: "TTL of key is between 25–30 seconds (EX 30 was applied)."

    - id: "ste-0006-0030-4000-a000-000000000004"
      stepNumber: STE-000039
      description: "Send GET /deals/summary again with JWT_MANAGER (second call — cache hit). Target: GetPipelineSummaryQueryHandler → Redis GET (hit) → return cached value."
      expectedResults:
        - id: 1
          description: "HTTP 200 OK."
        - id: 2
          description: "IDealRepository aggregate query was NOT called again (spy count still = 1)."
        - id: 3
          description: "Response is identical to first call."

  CAS-000031:
    - id: "ste-0006-0031-4000-a000-000000000001"
      stepNumber: STE-000040
      description: "Precondition: pipeline:summary:{MANAGER_UUID} exists in Redis (warm cache state). Seeded deal exists."
      expectedResults:
        - id: 1
          description: "Redis key exists and is valid."

    - id: "ste-0006-0031-4000-a000-000000000002"
      stepNumber: STE-000041
      description: "Send POST /deals with valid payload. Target: CreateDealUseCase → CacheInvalidationService.invalidatePipelineSummary()."
      expectedResults:
        - id: 1
          description: "HTTP 201 OK."

    - id: "ste-0006-0031-4000-a000-000000000003"
      stepNumber: STE-000042
      description: "Query Redis: GET pipeline:summary:{MANAGER_UUID}. Target: Redis after CreateDeal write."
      expectedResults:
        - id: 1
          description: "Key does NOT exist (was deleted by CacheInvalidationService)."

    - id: "ste-0006-0031-4000-a000-000000000004"
      stepNumber: STE-000043
      description: "Send GET /deals/summary (next call after invalidation). Target: GetPipelineSummaryQueryHandler."
      expectedResults:
        - id: 1
          description: "HTTP 200 OK."
        - id: 2
          description: "DB aggregate query is executed (cache miss)."
        - id: 3
          description: "total_active_deals reflects the newly created deal (count incremented by 1 vs prior)."

TES-000007:
  # Suite: Staleness Cron (CAS-000037)
  CAS-000037:
    - id: "ste-0007-0037-4000-a000-000000000001"
      stepNumber: STE-000044
      description: "Precondition: Seed 10 active deals with specified stage_entered_at values: 2 deals at NOW()-5d, 4 deals at NOW()-15d, 4 deals at NOW()-31d. Seed 2 archived deals (deleted_at IS NOT NULL) with stage_entered_at=NOW()-31d. Seed 1 Closed Won deal with stage_entered_at=NOW()-31d. Current staleness_level for all = 'NORMAL'."
      expectedResults:
        - id: 1
          description: "13 total deals in DB (10 active + 2 archived + 1 terminal)."
        - id: 2
          description: "All deals have staleness_level = 'NORMAL' initially."

    - id: "ste-0007-0037-4000-a000-000000000002"
      stepNumber: STE-000045
      description: "Manually invoke UpdateDealStaleness cron use-case (bypass @Cron schedule decorator in test). Target: UpdateDealStaleness.execute() → IDealRepository.findAllActiveForStalenessUpdate() → bulkUpdateStaleness()."
      expectedResults:
        - id: 1
          description: "Method executes without throwing exception."

    - id: "ste-0007-0037-4000-a000-000000000003"
      stepNumber: STE-000046
      description: "Query DB: SELECT id, staleness_level FROM deals WHERE deleted_at IS NULL AND stage.is_terminal = false. Target: active non-terminal deals."
      expectedResults:
        - id: 1
          description: "2 deals with stage_entered_at=NOW()-5d have staleness_level = 'NORMAL'."
        - id: 2
          description: "4 deals with stage_entered_at=NOW()-15d have staleness_level = 'WARNING'."
        - id: 3
          description: "4 deals with stage_entered_at=NOW()-31d have staleness_level = 'CRITICAL'."

    - id: "ste-0007-0037-4000-a000-000000000004"
      stepNumber: STE-000047
      description: "Query DB: SELECT staleness_level FROM deals WHERE deleted_at IS NOT NULL (archived deals). Target: archived deals."
      expectedResults:
        - id: 1
          description: "Both archived deals still have staleness_level = 'NORMAL' (cron did not update them)."

    - id: "ste-0007-0037-4000-a000-000000000005"
      stepNumber: STE-000048
      description: "Query DB: SELECT staleness_level FROM deals WHERE current_stage_id = CLOSED_WON_UUID. Target: terminal stage deal."
      expectedResults:
        - id: 1
          description: "Closed Won deal still has staleness_level = 'NORMAL' (cron did not update terminal deals)."

    - id: "ste-0007-0037-4000-a000-000000000006"
      stepNumber: STE-000049
      description: "Capture cron job log output. Target: UpdateDealStaleness log statement."
      expectedResults:
        - id: 1
          description: "Log contains: { scanned: 10, updated: 8 }."

TES-000008:
  # Suite: Redis Failure Degradation (CAS-000046)
  CAS-000046:
    - id: "ste-0008-0046-4000-a000-000000000001"
      stepNumber: STE-000050
      description: "Precondition: Configure Redis mock to throw ConnectionRefusedError on all commands. Seed valid deal DEAL_UUID_5 in 'New' stage. Authenticate as deal owner."
      expectedResults:
        - id: 1
          description: "Redis mock is active and will throw on any call."
        - id: 2
          description: "Deal exists in DB."

    - id: "ste-0008-0046-4000-a000-000000000002"
      stepNumber: STE-000051
      description: "Send PATCH /deals/DEAL_UUID_5/stage with { target_stage_id: QUALIFIED_STAGE_UUID }. Target: TransitionDealStageUseCase → DB transaction (succeeds) → CacheInvalidationService (Redis fails)."
      expectedResults:
        - id: 1
          description: "HTTP 200 OK (DB write succeeded)."
        - id: 2
          description: "Response body: DealResponseDto with current_stage = Qualified."
        - id: 3
          description: "Response does NOT contain any Redis error message."

    - id: "ste-0008-0046-4000-a000-000000000003"
      stepNumber: STE-000052
      description: "Query DB: SELECT current_stage_id FROM deals WHERE id=DEAL_UUID_5. Also check application error logs. Target: deals table + application log output."
      expectedResults:
        - id: 1
          description: "current_stage_id = QUALIFIED_STAGE_UUID (DB write persisted despite Redis failure)."
        - id: 2
          description: "Application log contains ERROR entry: 'CacheInvalidationService: Failed to invalidate pipeline summary cache - ConnectionRefusedError'."
        - id: 3
          description: "No unhandled exception in application logs."

TES-000009:
  # Suite: Duplicate Detection (CAS-000007)
  CAS-000007:
    - id: "ste-0009-0007-4000-a000-000000000001"
      stepNumber: STE-000053
