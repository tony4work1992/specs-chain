# FEA-001 — Tactic Architecture: Vertical Slice Directory Map
# Each SLICE maps one API endpoint to its full Clean Architecture file set

- id: SLICE_01
  module_name: "CreateDeal (POST /deals)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Presentation (Controller)"
      file_name: "deal.controller.ts"
      responsibility: "Receives POST /deals. Validates CreateDealDto via ValidationPipe. Calls CreateDealUseCase. Returns 201 DealResponseDto."
      dependencies: "CreateDealUseCase, DealMapper"
    - layer: "Application (UseCase)"
      file_name: "create-deal.use-case.ts"
      responsibility: "Validates contact_id exists (via IContactQueryService). Validates initial stage is order=1. Checks duplicate via IDealRepository. Creates Deal domain entity. Persists via IDealRepository. Triggers cache invalidation. Returns DealResponseDto."
      dependencies: "IDealRepository, IContactQueryService, CacheInvalidationService, DealMapper"
    - layer: "Application (DTO)"
      file_name: "create-deal.dto.ts"
      responsibility: "class-validator decorated DTO: title, contact_id, value, currency, expected_close_date, assigned_rep_id, source, description"
      dependencies: "class-validator, class-transformer"
    - layer: "Domain (Entity)"
      file_name: "deal.entity.ts"
      responsibility: "TypeORM @Entity('deals'). All columns declared. @DeleteDateColumn for soft-delete. @CreateDateColumn, @UpdateDateColumn. @ManyToOne to PipelineStageEntity."
      dependencies: "typeorm, pipeline-stage.entity.ts"
    - layer: "Domain (Entity)"
      file_name: "pipeline-stage.entity.ts"
      responsibility: "TypeORM @Entity('pipeline_stages'). Columns: id, name, order, is_terminal, is_won. Read-only reference."
      dependencies: "typeorm"
    - layer: "Domain (Entity)"
      file_name: "deal-stage-transition.entity.ts"
      responsibility: "TypeORM @Entity('deal_stage_transitions'). Columns: id, deal_id, from_stage_id, to_stage_id, transitioned_by_user_id, transitioned_at. Immutable — no @UpdateDateColumn."
      dependencies: "typeorm"
    - layer: "Domain (Interface)"
      file_name: "i-deal.repository.ts"
      responsibility: "Port interface: findById, findAll(filters), save, softDelete, bulkSoftDelete, bulkReassign, checkDuplicate, findByStage, countActiveByStage, sumValueByStage"
      dependencies: "deal.entity.ts, list-deals-query.dto.ts"
    - layer: "Infrastructure (Repository)"
      file_name: "deal.typeorm-repository.ts"
      responsibility: "Implements IDealRepository. Uses TypeORM DataSource/Repository. Builds QueryBuilder for filtered list/board queries with pg_trgm search. Handles soft-delete via withDeleted(false) by default."
      dependencies: "IDealRepository, DealEntity, TypeORM DataSource"
    - layer: "Application (Mapper)"
      file_name: "deal.mapper.ts"
      responsibility: "Maps DealEntity → DealResponseDto and DealDetailResponseDto. Resolves cross-module UserSummaryDto and ContactSummaryDto via injected services."
      dependencies: "DealEntity, DealResponseDto, DealDetailResponseDto, IUserQueryService, IContactQueryService"

- id: SLICE_02
  module_name: "GetDealById (GET /deals/:id)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Presentation (Controller)"
      file_name: "deal.controller.ts"
      responsibility: "GET /deals/:id handler. Applies JwtAuthGuard + OwnershipGuard. Calls GetDealByIdQueryHandler."
      dependencies: "GetDealByIdQueryHandler, OwnershipGuard"
    - layer: "Application (Query)"
      file_name: "get-deal-by-id.query-handler.ts"
      responsibility: "Fetches deal by UUID. Loads stage transitions. Resolves cross-module UserSummaryDto, ContactSummaryDto, CompanySummaryDto. Returns DealDetailResponseDto."
      dependencies: "IDealRepository, IDealStageTransitionRepository, IUserQueryService, IContactQueryService, DealMapper"
    - layer: "Presentation (Guard)"
      file_name: "ownership.guard.ts"
      responsibility: "Checks if current JWT user role is SALES_REP AND deal.assigned_rep_id !== currentUser.id. Throws ForbiddenException with DEAL_ACCESS_FORBIDDEN error code."
      dependencies: "JwtAuthGuard, IDealRepository"

- id: SLICE_03
  module_name: "UpdateDeal (PATCH /deals/:id)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Presentation (Controller)"
      file_name: "deal.controller.ts"
      responsibility: "PATCH /deals/:id handler. Applies JwtAuthGuard + OwnershipGuard. Calls UpdateDealUseCase."
      dependencies: "UpdateDealUseCase, OwnershipGuard"
    - layer: "Application (UseCase)"
      file_name: "update-deal.use-case.ts"
      responsibility: "Applies partial updates to deal fields. Validates expected_close_date is future if provided. Persists via IDealRepository.save(). Invalidates pipeline summary cache."
      dependencies: "IDealRepository, UpdateDealDto, CacheInvalidationService, DealMapper"
    - layer: "Application (DTO)"
      file_name: "update-deal.dto.ts"
      responsibility: "All fields optional. class-validator decorators. @PartialType(CreateDealDto) minus contact_id (contact not changeable after creation)."
      dependencies: "class-validator, CreateDealDto"

- id: SLICE_04
  module_name: "TransitionDealStage (PATCH /deals/:id/stage)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Presentation (Controller)"
      file_name: "deal.controller.ts"
      responsibility: "PATCH /deals/:id/stage. Applies JwtAuthGuard + OwnershipGuard. Calls TransitionDealStageUseCase."
      dependencies: "TransitionDealStageUseCase, TransitionDealStageDto, OwnershipGuard"
    - layer: "Application (UseCase)"
      file_name: "transition-deal-stage.use-case.ts"
      responsibility: "Critical path: (1) Check current stage is_terminal → throw DEAL_STAGE_TERMINAL if true. (2) Validate target stage is next in order OR is Closed Lost. (3) Open DB transaction. (4) UPDATE deals.current_stage_id, stage_entered_at=NOW(), closed_at=NOW() if terminal. (5) INSERT deal_stage_transitions record. (6) COMMIT. (7) Invalidate Redis cache. Returns DealResponseDto."
      dependencies: "IDealRepository, IDealStageTransitionRepository, IPipelineStageRepository, CacheInvalidationService, DataSource (for transaction), DealMapper"
    - layer: "Application (DTO)"
      file_name: "transition-deal-stage.dto.ts"
      responsibility: "Single field: target_stage_id: string @IsUUID('4') @IsNotEmpty()"
      dependencies: "class-validator"
    - layer: "Domain (Interface)"
      file_name: "i-deal-stage-transition.repository.ts"
      responsibility: "Port interface: save(transition), findByDealId(dealId): DealStageTransitionEntity[]"
      dependencies: "deal-stage-transition.entity.ts"
    - layer: "Infrastructure (Repository)"
      file_name: "deal-stage-transition.typeorm-repository.ts"
      responsibility: "Implements IDealStageTransitionRepository. Uses TypeORM Repository<DealStageTransitionEntity>. findByDealId orders by transitioned_at DESC."
      dependencies: "IDealStageTransitionRepository, DealStageTransitionEntity"
    - layer: "Domain (Interface)"
      file_name: "i-pipeline-stage.repository.ts"
      responsibility: "Port interface: findAll(): PipelineStageEntity[], findById(id): PipelineStageEntity"
      dependencies: "pipeline-stage.entity.ts"
    - layer: "Infrastructure (Repository)"
      file_name: "pipeline-stage.typeorm-repository.ts"
      responsibility: "Implements IPipelineStageRepository. Caches all stages in-memory on module init (stages are static). findAll() returns cached array."
      dependencies: "IPipelineStageRepository, PipelineStageEntity"

- id: SLICE_05
  module_name: "ListDeals (GET /deals)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Presentation (Controller)"
      file_name: "deal.controller.ts"
      responsibility: "GET /deals. Parses ListDealsQueryDto from query params. For SALES_REP role, forces rep_ids filter to [currentUser.id] regardless of query param. Calls ListDealsQueryHandler."
      dependencies: "ListDealsQueryHandler, ListDealsQueryDto, RolesGuard"
    - layer: "Application (Query)"
      file_name: "list-deals.query-handler.ts"
      responsibility: "Builds TypeORM QueryBuilder with all filter conditions. Applies sort + pagination. Returns PaginatedResponseDto<DealListItemDto> with total count."
      dependencies: "IDealRepository, ListDealsQueryDto, DealMapper"
    - layer: "Application (DTO)"
      file_name: "list-deals-query.dto.ts"
      responsibility: "Query param DTO: page, limit, stage_ids[], rep_ids[], value_min, value_max, sort_by, sort_dir, search, created_from, created_to, close_date_from, close_date_to"
      dependencies: "class-validator, class-transformer, @Transform"
    - layer: "Application (DTO)"
      file_name: "deal-list-item.dto.ts"
      responsibility: "Flattened DTO for list row: id, title, contact_name, company_name, assigned_rep_name, stage_name, stage_color, value, currency, expected_close_date, days_open, last_activity_date."
      dependencies: "DealEntity, ContactSummaryDto"
    - layer: "Application (DTO)"
      file_name: "paginated-response.dto.ts"
      responsibility: "Generic wrapper: { data: T[], total: number, page: number, limit: number, total_pages: number }"
      dependencies: "None"

- id: SLICE_06
  module_name: "GetPipelineBoard (GET /deals/board)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Presentation (Controller)"
      file_name: "deal-board.controller.ts"
      responsibility: "GET /deals/board. Separate controller for board-specific queries. Forces rep_id scope for SALES_REP. Calls GetPipelineBoardQueryHandler."
      dependencies: "GetPipelineBoardQueryHandler, PipelineBoardQueryDto"
    - layer: "Application (Query)"
      file_name: "get-pipeline-board.query-handler.ts"
      responsibility: "Fetches pipeline_stages (ordered). For each stage, fetches deals (max 50 per stage; client loads more via pagination). Resolves contact names. Returns PipelineBoardResponseDto with stage columns and deal card arrays."
      dependencies: "IDealRepository, IPipelineStageRepository, IContactQueryService, DealMapper"
    - layer: "Application (DTO)"
      file_name: "pipeline-board-response.dto.ts"
      responsibility: "{ stages: PipelineStageBoardColumnDto[] }. Each column: { stage_id, stage_name, deal_count, total_value, deals: DealCardDto[] }"
      dependencies: "None"
    - layer: "Application (DTO)"
      file_name: "deal-card.dto.ts"
      responsibility: "Minimal DTO for Kanban card: id, title, value, currency, contact_name, assigned_rep_name, assigned_rep_avatar_url, staleness_level, stage_entered_at, current_stage_id"
      dependencies: "None"

- id: SLICE_07
  module_name: "GetPipelineSummary (GET /deals/summary)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Presentation (Controller)"
      file_name: "deal-summary.controller.ts"
      responsibility: "GET /deals/summary. Manager/Admin only (RolesGuard). Calls GetPipelineSummaryQueryHandler."
      dependencies: "GetPipelineSummaryQueryHandler, RolesGuard"
    - layer: "Application (Query)"
      file_name: "get-pipeline-summary.query-handler.ts"
      responsibility: "Cache-aside: attempt Redis GET pipeline:summary:{userId}. On hit: return deserialized. On miss: run aggregate SQL queries (total_active_deals, total_value, value_by_stage, win_rate_30d, avg_cycle_time_30d). Serialize + SET Redis EX 30. Return PipelineSummaryResponseDto."
      dependencies: "IDealRepository, PipelineSummaryCacheRepository, PipelineSummaryResponseDto"
    - layer: "Infrastructure (Cache)"
      file_name: "pipeline-summary.cache-repository.ts"
      responsibility: "Wraps ioredis client. get(userId): PipelineSummaryResponseDto | null. set(userId, dto): void. invalidate(userId): void. Handles JSON serialize/deserialize."
      dependencies: "ioredis, PipelineSummaryResponseDto"
    - layer: "Infrastructure (Service)"
      file_name: "cache-invalidation.service.ts"
      responsibility: "Called by all write use-cases. invalidatePipelineSummary(managerId): calls PipelineSummaryCacheRepository.invalidate(managerId). Resolves managerId from assignedRepId via IUserQueryService if caller is a rep."
      dependencies: "PipelineSummaryCacheRepository, IUserQueryService"

- id: SLICE_08
  module_name: "ExportDeals (POST /deals/export)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Presentation (Controller)"
      file_name: "deal-export.controller.ts"
      responsibility: "POST /deals/export. Manager/Admin only. If row count ≤500: calls ExportDealsCommand synchronously, pipes CSV stream to response. If >500: dispatches Bull job, returns 202 with job_id."
      dependencies: "ExportDealsCommand, BullModule, RolesGuard"
    - layer: "Application (UseCase)"
      file_name: "export-deals.command.ts"
      responsibility: "Fetches filtered deals (max 1000, else throw EXPORT_LIMIT_EXCEEDED). Generates CSV via fast-csv. For async: uploads to S3 via DealCsvExportAdapter. Stores download_url in Redis deal_export:{jobId}. Updates job status COMPLETED."
      dependencies: "IDealRepository, DealCsvExportAdapter, ioredis"
    - layer: "Infrastructure (Adapter)"
      file_name: "deal-csv-export.adapter.ts"
      responsibility: "Uses AWS SDK v3 S3Client. PutObjectCommand to upload CSV buffer. GetSignedUrlCommand to generate pre-signed URL (1hr expiry). Returns download_url string."
      dependencies: "@aws-sdk/client-s3, @aws-sdk/s3-request-presigner"

- id: SLICE_09
  module_name: "UpdateDealStaleness (Cron)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Application (UseCase / Cron)"
      file_name: "update-deal-staleness.use-case.ts"
      responsibility: "NestJS @Cron('0 * * * *'). Queries IDealRepository.findAllActiveForStalenessUpdate(). Computes staleness_level per deal using NOW() - stage_entered_at. Calls IDealRepository.bulkUpdateStaleness(updates). Logs summary: {scanned: N, updated: M}."
      dependencies: "IDealRepository, StalenessLevelEnum"
    - layer: "Infrastructure (Repository Extension)"
      file_name: "deal.typeorm-repository.ts"
      responsibility: "Additional methods: findAllActiveForStalenessUpdate() → SELECT id, stage_entered_at WHERE deleted_at IS NULL AND stage.is_terminal=false. bulkUpdateStaleness(updates: {id, staleness_level}[]) → single UPDATE ... CASE WHEN statement."
      dependencies: "DataSource, DealEntity"

- id: SLICE_10
  module_name: "DealPipelineModule (NestJS Module)"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - layer: "Module Definition"
      file_name: "deal-pipeline.module.ts"
      responsibility: "NestJS @Module. Imports: TypeOrmModule.forFeature([DealEntity, PipelineStageEntity, DealStageTransitionEntity]), BullModule.registerQueue('deal-exports'), ScheduleModule. Providers: all repositories, use-cases, query-handlers, cache services, controllers. Exports: IDealRepository (for cross-module use if needed)."
      dependencies: "TypeOrmModule, BullModule, ScheduleModule, all SLICE files"
    - layer: "Module Definition"
      file_name: "deal-pipeline.constants.ts"
      responsibility: "DI tokens: DEAL_REPOSITORY, PIPELINE_STAGE_REPOSITORY, DEAL_STAGE_TRANSITION_REPOSITORY, PIPELINE_SUMMARY_CACHE. Used for interface-based injection."
      dependencies: "None"
    - layer: "Shared (Guard)"
      file_name: "ownership.guard.ts"
      responsibility: "CanActivate. Extracts deal UUID from route param. Fetches deal via IDealRepository. Checks role + ownership. Throws ForbiddenException if SALES_REP and not owner."
      dependencies: "IDealRepository, JwtAuthGuard, Reflector"
    - layer: "Shared (Interceptor)"
      file_name: "deal-response-transform.interceptor.ts"
      responsibility: "Wraps all DealController responses in { success: true, data: ..., timestamp: ISO }. Applied at module level."
      dependencies: "NestInterceptor, Observable"
