- id: SEC-006
  title: "Table 6: UI State Definitions (Zustand + TanStack Query)"
  theme: "orange"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - store: "usePipelineBoardStore (Zustand)"
      state_key: "boardColumns"
      type: "Record<stageId, DealCardDto[]>"
      description: "Local deal cards grouped by stage. Source of truth for board rendering."
      mutations: "setColumns, moveCard (optimistic), rollbackCard"
    - store: "usePipelineBoardStore (Zustand)"
      state_key: "pendingTransitions"
      type: "Map<dealId, targetStageId>"
      description: "Tracks in-flight stage transitions for optimistic rollback."
      mutations: "addPending, removePending, rollbackPending"
    - store: "usePipelineBoardStore (Zustand)"
      state_key: "activeFilters"
      type: "PipelineBoardQueryDto"
      description: "Currently applied board filters. Persisted to URL."
      mutations: "setFilter, clearFilter, clearAll"
    - store: "usePipelineBoardStore (Zustand)"
      state_key: "searchQuery"
      type: "string"
      description: "Debounced search input value."
      mutations: "setSearchQuery"
    - query: "useDealsBoard (TanStack Query)"
      query_key: "['deals', 'board', filters]"
      api_ref: "API_07"
      stale_time: "0"
      refetch_interval: "null (manual only)"
      description: "Fetches pipeline board data. Invalidated on any deal mutation."
    - query: "useDealDetail (TanStack Query)"
      query_key: "['deals', dealId]"
      api_ref: "API_02"
      stale_time: "30000"
      refetch_interval: "null"
      description: "Fetches single deal detail. Invalidated on update/stage transition."
    - query: "usePipelineSummary (TanStack Query)"
      query_key: "['deals', 'summary', filters]"
      api_ref: "API_08"
      stale_time: "0"
      refetch_interval: "30000"
      description: "Polls pipeline summary every 30s. Manager/Admin only."
    - query: "useDealsListView (TanStack Query)"
      query_key: "['deals', 'list', listParams]"
      api_ref: "API_06"
      stale_time: "0"
      refetch_interval: "null"
      description: "Paginated list view. Invalidated on bulk actions."

