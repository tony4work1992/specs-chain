# FEA-001 — Deal Pipeline Management: Functional Specifications
# Schema: flat relational key-value table format (no nested objects)

- id: SEC-001
  title: "Table 1: Database Entities & Columns"
  theme: "blue"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    # --- pipeline_stages table ---
    - entity: "pipeline_stages"
      column: "id"
      type: "uuid"
      primary_key: "true"
      nullable: "false"
      default: "gen_random_uuid()"
      notes: "PK, pre-seeded, immutable at runtime"
    - entity: "pipeline_stages"
      column: "name"
      type: "varchar(60)"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "e.g. New, Qualified, Proposal Sent, Negotiation, Closed Won, Closed Lost"
    - entity: "pipeline_stages"
      column: "order"
      type: "int"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "1=New, 2=Qualified, 3=Proposal Sent, 4=Negotiation, 5=Closed Won, 6=Closed Lost"
    - entity: "pipeline_stages"
      column: "is_terminal"
      type: "boolean"
      primary_key: "false"
      nullable: "false"
      default: "false"
      notes: "true for Closed Won and Closed Lost — blocks further transitions"
    - entity: "pipeline_stages"
      column: "is_won"
      type: "boolean"
      primary_key: "false"
      nullable: "false"
      default: "false"
      notes: "true only for Closed Won — used in win-rate calculation"
    # --- deals table ---
    - entity: "deals"
      column: "id"
      type: "uuid"
      primary_key: "true"
      nullable: "false"
      default: "gen_random_uuid()"
      notes: "PK, UUID v4"
    - entity: "deals"
      column: "title"
      type: "varchar(120)"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "Max 120 chars. Full-text search index via pg_trgm"
    - entity: "deals"
      column: "contact_id"
      type: "uuid"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "FK → contacts.id (cross-module reference, no FK constraint enforced at DB level — enforced at application layer)"
    - entity: "deals"
      column: "company_id"
      type: "uuid"
      primary_key: "false"
      nullable: "true"
      default: "null"
      notes: "FK → companies.id, optional, auto-resolved from contact's company"
    - entity: "deals"
      column: "current_stage_id"
      type: "uuid"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "FK → pipeline_stages.id"
    - entity: "deals"
      column: "assigned_rep_id"
      type: "uuid"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "FK → users.id (cross-module, no DB FK). Must always be populated."
    - entity: "deals"
      column: "value"
      type: "bigint"
      primary_key: "false"
      nullable: "false"
      default: "0"
      notes: "Stored in minor units (cents for USD, VND integer). Must be > 0."
    - entity: "deals"
      column: "currency"
      type: "varchar(3)"
      primary_key: "false"
      nullable: "false"
      default: "VND"
      notes: "ISO 4217 currency code. System-level config default."
    - entity: "deals"
      column: "source"
      type: "enum"
      primary_key: "false"
      nullable: "true"
      default: "null"
      notes: "Enum: INBOUND | OUTBOUND | REFERRAL | EVENT | OTHER"
    - entity: "deals"
      column: "expected_close_date"
      type: "date"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "Must be today or future on creation"
    - entity: "deals"
      column: "description"
      type: "text"
      primary_key: "false"
      nullable: "true"
      default: "null"
      notes: "Optional rich text, max 2000 chars enforced at application layer"
    - entity: "deals"
      column: "stage_entered_at"
      type: "timestamptz"
      primary_key: "false"
      nullable: "false"
      default: "NOW()"
      notes: "Updated on every stage transition. Used for staleness calculation."
    - entity: "deals"
      column: "staleness_level"
      type: "enum"
      primary_key: "false"
      nullable: "false"
      default: "NORMAL"
      notes: "Enum: NORMAL | WARNING | CRITICAL. Updated by Cron job hourly."
    - entity: "deals"
      column: "closed_at"
      type: "timestamptz"
      primary_key: "false"
      nullable: "true"
      default: "null"
      notes: "Set when deal transitions to Closed Won or Closed Lost. Used for cycle time."
    - entity: "deals"
      column: "created_by_user_id"
      type: "uuid"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "Immutable after creation. Cross-module reference to users.id"
    - entity: "deals"
      column: "created_at"
      type: "timestamptz"
      primary_key: "false"
      nullable: "false"
      default: "NOW()"
      notes: "Managed by TypeORM @CreateDateColumn"
    - entity: "deals"
      column: "updated_at"
      type: "timestamptz"
      primary_key: "false"
      nullable: "false"
      default: "NOW()"
      notes: "Managed by TypeORM @UpdateDateColumn"
    - entity: "deals"
      column: "deleted_at"
      type: "timestamptz"
      primary_key: "false"
      nullable: "true"
      default: "null"
      notes: "Soft-delete via TypeORM @DeleteDateColumn. NULL = active, NOT NULL = archived."
    # --- deal_stage_transitions table ---
    - entity: "deal_stage_transitions"
      column: "id"
      type: "uuid"
      primary_key: "true"
      nullable: "false"
      default: "gen_random_uuid()"
      notes: "PK"
    - entity: "deal_stage_transitions"
      column: "deal_id"
      type: "uuid"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "FK → deals.id ON DELETE CASCADE"
    - entity: "deal_stage_transitions"
      column: "from_stage_id"
      type: "uuid"
      primary_key: "false"
      nullable: "true"
      default: "null"
      notes: "NULL for the initial stage assignment on creation"
    - entity: "deal_stage_transitions"
      column: "to_stage_id"
      type: "uuid"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "FK → pipeline_stages.id"
    - entity: "deal_stage_transitions"
      column: "transitioned_by_user_id"
      type: "uuid"
      primary_key: "false"
      nullable: "false"
      default: ""
      notes: "Cross-module reference to users.id"
    - entity: "deal_stage_transitions"
      column: "transitioned_at"
      type: "timestamptz"
      primary_key: "false"
      nullable: "false"
      default: "NOW()"
      notes: "Immutable. Set at insert time."
    # --- deal_export_jobs (Redis hash, not DB table) ---
    - entity: "deal_export_jobs [Redis Hash]"
      column: "job_id"
      type: "string (uuid)"
      primary_key: "true"
      nullable: "false"
      default: ""
      notes: "Key: deal_export:{jobId}. TTL: 3600s"
    - entity: "deal_export_jobs [Redis Hash]"
      column: "status"
      type: "enum"
      primary_key: "false"
      nullable: "false"
      default: "PENDING"
      notes: "Enum: PENDING | PROCESSING | COMPLETED | FAILED"
    - entity: "deal_export_jobs [Redis Hash]"
      column: "download_url"
      type: "string"
      primary_key: "false"
      nullable: "true"
      default: "null"
      notes: "S3 pre-signed URL, 1-hour expiry. Set on COMPLETED."

- id: SEC-002
  title: "Table 2: Database Indexes"
  theme: "indigo"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - table: "deals"
      index_name: "idx_deals_assigned_rep_id"
      columns: "assigned_rep_id"
      type: "BTREE"
      reason: "Filter deals by rep. Used in GetPipelineBoardQuery and ListDealsQuery."
    - table: "deals"
      index_name: "idx_deals_current_stage_id"
      columns: "current_stage_id"
      type: "BTREE"
      reason: "Group by stage in board query."
    - table: "deals"
      index_name: "idx_deals_deleted_at"
      columns: "deleted_at"
      type: "BTREE"
      reason: "Filter active (deleted_at IS NULL) deals efficiently."
    - table: "deals"
      index_name: "idx_deals_expected_close_date"
      columns: "expected_close_date"
      type: "BTREE"
      reason: "Range filter in list view."
    - table: "deals"
      index_name: "idx_deals_created_at"
      columns: "created_at"
      type: "BTREE"
      reason: "Date range filter and default sort."
    - table: "deals"
      index_name: "idx_deals_title_trgm"
      columns: "title"
      type: "GIN (pg_trgm)"
      reason: "Trigram full-text search for board search (FR-012)."
    - table: "deals"
      index_name: "idx_deals_staleness_level"
      columns: "staleness_level"
      type: "BTREE"
      reason: "Cron job UPDATE WHERE staleness_level != computed_value."
    - table: "deal_stage_transitions"
      index_name: "idx_dst_deal_id"
      columns: "deal_id"
      type: "BTREE"
      reason: "Fetch all transitions for a deal (FR-016)."

- id: SEC-003
  title: "Table 3: API Endpoints"
  theme: "emerald"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - api_id: "API_01"
      method: "POST"
      path: "/deals"
      controller: "DealController"
      use_case: "CreateDealUseCase"
      roles_allowed: "SALES_REP, SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard"
      request_dto: "CreateDealDto"
      response_dto: "DealResponseDto"
      http_success: "201"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_02"
      method: "GET"
      path: "/deals/:id"
      controller: "DealController"
      use_case: "GetDealByIdQueryHandler"
      roles_allowed: "SALES_REP (own only), SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard + OwnershipGuard"
      request_dto: "N/A (UUID path param)"
      response_dto: "DealDetailResponseDto"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_03"
      method: "PATCH"
      path: "/deals/:id"
      controller: "DealController"
      use_case: "UpdateDealUseCase"
      roles_allowed: "SALES_REP (own only), SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard + OwnershipGuard"
      request_dto: "UpdateDealDto"
      response_dto: "DealResponseDto"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_04"
      method: "PATCH"
      path: "/deals/:id/stage"
      controller: "DealController"
      use_case: "TransitionDealStageUseCase"
      roles_allowed: "SALES_REP (own only), SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard + OwnershipGuard"
      request_dto: "TransitionDealStageDto"
      response_dto: "DealResponseDto"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_05"
      method: "DELETE"
      path: "/deals/:id"
      controller: "DealController"
      use_case: "ArchiveDealUseCase"
      roles_allowed: "SALES_REP (own only), SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard + OwnershipGuard"
      request_dto: "N/A"
      response_dto: "{ message: string }"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_06"
      method: "GET"
      path: "/deals"
      controller: "DealController"
      use_case: "ListDealsQueryHandler"
      roles_allowed: "SALES_REP (own only), SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard"
      request_dto: "ListDealsQueryDto (query params)"
      response_dto: "PaginatedResponseDto<DealListItemDto>"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_07"
      method: "GET"
      path: "/deals/board"
      controller: "DealBoardController"
      use_case: "GetPipelineBoardQueryHandler"
      roles_allowed: "SALES_REP (own only), SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard"
      request_dto: "PipelineBoardQueryDto (query params)"
      response_dto: "PipelineBoardResponseDto"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_08"
      method: "GET"
      path: "/deals/summary"
      controller: "DealSummaryController"
      use_case: "GetPipelineSummaryQueryHandler"
      roles_allowed: "SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard"
      request_dto: "PipelineSummaryQueryDto (query params)"
      response_dto: "PipelineSummaryResponseDto"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_09"
      method: "GET"
      path: "/deals/check-duplicate"
      controller: "DealController"
      use_case: "DuplicateDealCheckQueryHandler"
      roles_allowed: "SALES_REP, SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard"
      request_dto: "CheckDuplicateQueryDto (title, contact_id)"
      response_dto: "{ duplicate_found: boolean, existing_deal_id: string | null }"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_10"
      method: "POST"
      path: "/deals/export"
      controller: "DealExportController"
      use_case: "ExportDealsCommand"
      roles_allowed: "SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard"
      request_dto: "ExportDealsDto (filters + format)"
      response_dto: "File download (sync ≤500 rows) | { job_id: string } (async >500 rows)"
      http_success: "200 | 202"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_11"
      method: "GET"
      path: "/deals/export/:jobId/status"
      controller: "DealExportController"
      use_case: "GetExportJobStatusQueryHandler"
      roles_allowed: "SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard"
      request_dto: "N/A (UUID path param)"
      response_dto: "{ job_id: string, status: string, download_url: string | null }"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_12"
      method: "PATCH"
      path: "/deals/bulk-reassign"
      controller: "DealController"
      use_case: "BulkReassignDealsCommand"
      roles_allowed: "SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard"
      request_dto: "BulkReassignDto"
      response_dto: "{ updated_count: number }"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"
    - api_id: "API_13"
      method: "POST"
      path: "/deals/bulk-archive"
      controller: "DealController"
      use_case: "BulkArchiveDealsCommand"
      roles_allowed: "SALES_MANAGER, ADMIN"
      auth: "JwtAuthGuard + RolesGuard"
      request_dto: "BulkArchiveDto"
      response_dto: "{ archived_count: number }"
      http_success: "200"
      component_ref: "Component 2: NestJS REST API Gateway"

- id: SEC-004
  title: "Table 4: Request DTOs"
  theme: "violet"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - dto: "CreateDealDto"
      field: "title"
      type: "string"
      decorator: "@IsString() @MaxLength(120) @IsNotEmpty()"
      required: "true"
      api_ref: "API_01"
    - dto: "CreateDealDto"
      field: "contact_id"
      type: "string"
      decorator: "@IsUUID('4')"
      required: "true"
      api_ref: "API_01"
    - dto: "CreateDealDto"
      field: "value"
      type: "number"
      decorator: "@IsInt() @IsPositive() @Min(1)"
      required: "true"
      api_ref: "API_01"
    - dto: "CreateDealDto"
      field: "currency"
      type: "string"
      decorator: "@IsEnum(['VND','USD']) @IsOptional()"
      required: "false"
      api_ref: "API_01"
    - dto: "CreateDealDto"
      field: "expected_close_date"
      type: "string"
      decorator: "@IsDateString() @IsFutureDate()"
      required: "true"
      api_ref: "API_01"
    - dto: "CreateDealDto"
      field: "assigned_rep_id"
      type: "string"
      decorator: "@IsUUID('4') @IsOptional()"
      required: "false"
      api_ref: "API_01"
    - dto: "CreateDealDto"
      field: "source"
      type: "string"
      decorator: "@IsEnum(DealSourceEnum) @IsOptional()"
      required: "false"
      api_ref: "API_01"
    - dto: "CreateDealDto"
      field: "description"
      type: "string"
      decorator: "@IsString() @MaxLength(2000) @IsOptional()"
      required: "false"
      api_ref: "API_01"
    - dto: "UpdateDealDto"
      field: "title"
      type: "string"
      decorator: "@IsString() @MaxLength(120) @IsOptional()"
      required: "false"
      api_ref: "API_03"
    - dto: "UpdateDealDto"
      field: "value"
      type: "number"
      decorator: "@IsInt() @IsPositive() @Min(1) @IsOptional()"
      required: "false"
      api_ref: "API_03"
    - dto: "UpdateDealDto"
      field: "expected_close_date"
      type: "string"
      decorator: "@IsDateString() @IsFutureDate() @IsOptional()"
      required: "false"
      api_ref: "API_03"
    - dto: "UpdateDealDto"
      field: "description"
      type: "string"
      decorator: "@IsString() @MaxLength(2000) @IsOptional()"
      required: "false"
      api_ref: "API_03"
    - dto: "TransitionDealStageDto"
      field: "target_stage_id"
      type: "string"
      decorator: "@IsUUID('4') @IsNotEmpty()"
      required: "true"
      api_ref: "API_04"
    - dto: "ListDealsQueryDto"
      field: "page"
      type: "number"
      decorator: "@IsInt() @Min(1) @IsOptional() @Default(1)"
      required: "false"
      api_ref: "API_06"
    - dto: "ListDealsQueryDto"
      field: "limit"
      type: "number"
      decorator: "@IsInt() @IsIn([10,25,50,100]) @IsOptional() @Default(25)"
      required: "false"
      api_ref: "API_06"
    - dto: "ListDealsQueryDto"
      field: "stage_ids"
      type: "string[]"
      decorator: "@IsArray() @IsUUID('4', {each: true}) @IsOptional()"
      required: "false"
      api_ref: "API_06"
    - dto: "ListDealsQueryDto"
      field: "rep_ids"
      type: "string[]"
      decorator: "@IsArray() @IsUUID('4', {each: true}) @IsOptional()"
      required: "false"
      api_ref: "API_06"
    - dto: "ListDealsQueryDto"
      field: "value_min"
      type: "number"
      decorator: "@IsInt() @Min(0) @IsOptional()"
      required: "false"
      api_ref: "API_06"
    - dto: "ListDealsQueryDto"
      field: "value_max"
      type: "number"
      decorator: "@IsInt() @Min(0) @IsOptional()"
      required: "false"
      api_ref: "API_06"
    - dto: "ListDealsQueryDto"
      field: "sort_by"
      type: "string"
      decorator: "@IsEnum(DealSortByEnum) @IsOptional() @Default('last_activity_date')"
      required: "false"
      api_ref: "API_06"
    - dto: "ListDealsQueryDto"
      field: "sort_dir"
      type: "string"
      decorator: "@IsEnum(['asc','desc']) @IsOptional() @Default('desc')"
      required: "false"
      api_ref: "API_06"
    - dto: "BulkReassignDto"
      field: "deal_ids"
      type: "string[]"
      decorator: "@IsArray() @IsUUID('4', {each: true}) @ArrayMinSize(1) @ArrayMaxSize(100)"
      required: "true"
      api_ref: "API_12"
    - dto: "BulkReassignDto"
      field: "new_rep_id"
      type: "string"
      decorator: "@IsUUID('4') @IsNotEmpty()"
      required: "true"
      api_ref: "API_12"
    - dto: "BulkArchiveDto"
      field: "deal_ids"
      type: "string[]"
      decorator: "@IsArray() @IsUUID('4', {each: true}) @ArrayMinSize(1) @ArrayMaxSize(100)"
      required: "true"
      api_ref: "API_13"

- id: SEC-005
  title: "Table 5: Response DTOs"
  theme: "cyan"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - dto: "DealResponseDto"
      field: "id"
      type: "string (uuid)"
      source: "deals.id"
      api_ref: "API_01, API_03, API_04"
    - dto: "DealResponseDto"
      field: "title"
      type: "string"
      source: "deals.title"
      api_ref: "API_01, API_03, API_04"
    - dto: "DealResponseDto"
      field: "value"
      type: "number"
      source: "deals.value"
      api_ref: "API_01, API_03, API_04"
    - dto: "DealResponseDto"
      field: "currency"
      type: "string"
      source: "deals.currency"
      api_ref: "API_01, API_03, API_04"
    - dto: "DealResponseDto"
      field: "current_stage_id"
      type: "string (uuid)"
      source: "deals.current_stage_id"
      api_ref: "API_01, API_03, API_04"
    - dto: "DealResponseDto"
      field: "current_stage_name"
      type: "string"
      source: "pipeline_stages.name (joined)"
      api_ref: "API_01, API_03, API_04"
    - dto: "DealResponseDto"
      field: "assigned_rep_id"
      type: "string (uuid)"
      source: "deals.assigned_rep_id"
      api_ref: "API_01, API_03, API_04"
    - dto: "DealResponseDto"
      field: "assigned_rep_name"
      type: "string"
      source: "UserSummaryDto.fullName (cross-module)"
      api_ref: "API_01, API_03, API_04"
    - dto: "DealResponseDto"
      field: "contact_id"
      type: "string (uuid)"
      source: "deals.contact_id"
      api_ref: "API_01, API_03, API_04"
    - dto: "DealResponseDto"
      field: "contact_name"
      type: "string"
      source: "ContactSummaryDto.fullName (cross-module)"
      api_ref: "API_01, API_03, API_04"
