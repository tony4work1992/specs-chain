- id: SEC-008
  title: "Table 8: Error Codes Registry"
  theme: "red"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - error_code: "INVALID_STAGE_TRANSITION"
      http_status: "422"
      thrown_by: "TransitionDealStageUseCase"
      description: "Target stage is not the valid next stage for this deal"
    - error_code: "INVALID_INITIAL_STAGE"
      http_status: "422"
      thrown_by: "CreateDealUseCase"
      description: "Client attempted to create deal in a non-first stage"
    - error_code: "DEAL_STAGE_TERMINAL"
      http_status: "422"
      thrown_by: "TransitionDealStageUseCase"
      description: "Deal is in a terminal stage (Closed Won/Lost) — no transitions allowed"
    - error_code: "DEAL_NOT_FOUND"
      http_status: "404"
      thrown_by: "GetDealByIdQueryHandler, UpdateDealUseCase"
      description: "Deal UUID does not exist or is archived"
    - error_code: "DEAL_ACCESS_FORBIDDEN"
      http_status: "403"
      thrown_by: "OwnershipGuard"
      description: "Sales Rep attempted to access a deal they do not own"
    - error_code: "EXPORT_LIMIT_EXCEEDED"
      http_status: "422"
      thrown_by: "ExportDealsCommand"
      description: "Export request exceeds 1000 row limit"
    - error_code: "CONTACT_NOT_FOUND"
      http_status: "422"
      thrown_by: "CreateDealUseCase"
      description: "Provided contact_id does not exist in the Contact module"

- id: SEC-009
  title: "Table 9: Cron Job Specifications"
  theme: "teal"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - cron_id: "CRON_01"
      name: "UpdateDealStalenessJob"
      schedule: "0 * * * * (every hour on the hour)"
      use_case: "UpdateDealStalenessUseCase"
      component_ref: "Component 5: Stale Deal Cron Worker"
      logic: "SELECT all active deals WHERE deleted_at IS NULL AND current_stage.is_terminal = false. Compute staleness_level per deal. Bulk UPDATE deals SET staleness_level = CASE WHEN ..."
      on_failure: "Log error to pino with level=error. Do not throw — cron must not crash the process."
      timeout_guard: "30 seconds max execution. If exceeded, log warning and abort."

- id: SEC-010
  title: "Table 10: Environment Variables"
  theme: "slate"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - variable: "DATABASE_URL"
      type: "string"
      required: "true"
      notes: "PostgreSQL connection string. Injected via AWS Secrets Manager at runtime."
    - variable: "REDIS_URL"
      type: "string"
      required: "true"
      notes: "Redis connection string. Injected via AWS Secrets Manager."
    - variable: "JWT_PUBLIC_KEY"
      type: "string"
      required: "true"
      notes: "RS256 public key for JWT verification. PEM format."
    - variable: "AWS_S3_BUCKET_EXPORTS"
      type: "string"
      required: "true"
      notes: "S3 bucket name for CSV export files."
    - variable: "AWS_S3_PRESIGN_EXPIRY_SECONDS"
      type: "number"
      required: "false"
      notes: "Pre-signed URL TTL in seconds. Default: 3600."
    - variable: "PIPELINE_SUMMARY_CACHE_TTL"
      type: "number"
      required: "false"
      notes: "Redis TTL for pipeline summary cache in seconds. Default: 30."
    - variable: "DEAL_EXPORT_MAX_ROWS"
      type: "number"
      required: "false"
      notes: "Maximum rows allowed per CSV export. Default: 1000."
    - variable: "DEAL_EXPORT_ASYNC_THRESHOLD"
      type: "number"
      required: "false"
      notes: "Row count above which export goes async. Default: 500."
    - variable: "STALENESS_WARNING_DAYS"
      type: "number"
      required: "false"
      notes: "Days threshold for WARNING staleness level. Default: 14."
    - variable: "STALENESS_CRITICAL_DAYS"
      type: "number"
      required: "false"
      notes: "Days threshold for CRITICAL staleness level. Default: 30."
