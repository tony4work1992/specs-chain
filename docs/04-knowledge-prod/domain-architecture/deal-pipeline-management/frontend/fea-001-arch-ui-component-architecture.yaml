# FEA-001 — UI Component Architecture (Atomic Design)
# Classification: Smart = fetches data/state | Dumb = pure presentational

- id: TIER-001
  title: "Atoms"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - id: "COM_01"
      component_name: "StaleBadge"
      classification: "Dumb"
      props: "level: 'NORMAL'|'WARNING'|'CRITICAL', daysInStage: number"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Badge"
      notes: "Green/amber/red pulsing badge. No badge rendered if level=NORMAL."

    - id: "COM_02"
      component_name: "StageBadge"
      classification: "Dumb"
      props: "stageName: string, stageColor: TailwindColorClass"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Badge"
      notes: "Color-coded stage pill. Color class mapping defined in FR-037."

    - id: "COM_03"
      component_name: "CurrencyDisplay"
      classification: "Dumb"
      props: "value: number, currency: 'VND'|'USD'"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "span"
      notes: "Uses Intl.NumberFormat. VND → ₫1,234,567. USD → $1,234.56."

    - id: "COM_04"
      component_name: "UserAvatar"
      classification: "Dumb"
      props: "name: string, avatarUrl: string | null, size: 'sm'|'md'|'lg'"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Avatar"
      notes: "Shows image if avatarUrl present, else initials fallback."

    - id: "COM_05"
      component_name: "DealValueInput"
      classification: "Dumb"
      props: "value: number, currency: string, onChange: (val: number) => void, error: string | null"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Input"
      notes: "Numeric input with currency prefix label. Formats on blur."

    - id: "COM_06"
      component_name: "DatePickerField"
      classification: "Dumb"
      props: "label: string, value: Date | null, onChange: (d: Date) => void, minDate: Date, error: string | null"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Popover + Calendar"
      notes: "minDate enforces future-date constraint for expected_close_date."

    - id: "COM_07"
      component_name: "ExportButton"
      classification: "Dumb"
      props: "onClick: () => void, isLoading: boolean, disabled: boolean"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Button"
      notes: "Shows spinner when isLoading. Used in Deal List toolbar."

    - id: "COM_08"
      component_name: "StageTransitionHistoryItem"
      classification: "Dumb"
      props: "fromStageName: string | null, toStageName: string, movedByName: string, transitionedAt: string"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "li, StageBadge x2, span"
      notes: "Single row in the transition history accordion."

    - id: "COM_09"
      component_name: "DuplicateWarningBanner"
      classification: "Dumb"
      props: "visible: boolean, existingDealId: string | null, onConfirm: () => void, onCancel: () => void"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Alert, Button x2"
      notes: "Non-blocking yellow banner shown when duplicate detected in creation form."

    - id: "COM_10"
      component_name: "BoardSearchInput"
      classification: "Dumb"
      props: "value: string, onChange: (q: string) => void, placeholder: string"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Input, lucide SearchIcon"
      notes: "Parent manages 300ms debounce before propagating to store."

- id: TIER-002
  title: "Molecules"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - id: "COM_11"
      component_name: "DealCard"
      classification: "Dumb"
      props: "deal: DealCardDto, isDragging: boolean, onLogActivity: (dealId: string) => void"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Card, UserAvatar(COM_04), CurrencyDisplay(COM_03), StaleBadge(COM_01), lucide ActivityIcon"
      notes: "The Kanban card. Wrapped by DraggableDealCard organism for DnD. Title truncated at 40 chars with Shadcn Tooltip."

    - id: "COM_12"
      component_name: "PipelineStageColumnHeader"
      classification: "Dumb"
      props: "stageName: string, dealCount: number, totalValue: number, currency: string"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "div, StageBadge(COM_02), CurrencyDisplay(COM_03), span"
      notes: "Header row of each Kanban column showing stage name, deal count, total value."

    - id: "COM_13"
      component_name: "BoardFilterChip"
      classification: "Dumb"
      props: "label: string, onRemove: () => void"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Badge, lucide XIcon"
      notes: "Removable filter chip displayed below the filter bar."

    - id: "COM_14"
      component_name: "DealFormFields"
      classification: "Dumb"
      props: "control: RHFControl, errors: FieldErrors, contacts: ContactOptionDto[], reps: UserOptionDto[], showRepField: boolean"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Input x3, Shadcn Select x3, DatePickerField(COM_06), DealValueInput(COM_05), Shadcn Textarea"
      notes: "Pure form fields. React Hook Form control passed from parent. showRepField hidden for Sales Rep role."

    - id: "COM_15"
      component_name: "StageTransitionDropdown"
      classification: "Dumb"
      props: "currentStageId: string, allowedNextStages: PipelineStageDto[], onSelect: (stageId: string) => void, disabled: boolean"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn DropdownMenu, StageBadge(COM_02) per item"
      notes: "Shows only valid next stages + Closed Lost. Disabled if deal is in terminal stage."

    - id: "COM_16"
      component_name: "PipelineSummaryMetricCard"
      classification: "Dumb"
      props: "label: string, value: string | number, unit: string | null, trend: 'up'|'down'|null"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn Card, lucide TrendingUp/Down"
      notes: "Single KPI metric card. Used inside PipelineSummaryBarOrganism."

    - id: "COM_17"
      component_name: "DealListRowActions"
      classification: "Dumb"
      props: "dealId: string, onEdit: () => void, onArchive: () => void"
      state_bindings: "null"
      api_dependency: "null"
      dom_hierarchy: "Shadcn DropdownMenu, lucide EditIcon, lucide ArchiveIcon"
      notes: "Action cell in the Deal List table."

- id: TIER-003
  title: "Organisms"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - id: "COM_18"
      component_name: "DraggableDealCard"
      classification: "Smart"
      props: "deal: DealCardDto, stageId: string"
      state_bindings: "usePipelineBoardStore.pendingTransitions"
      api_dependency: "null (parent organism dispatches PATCH /deals/:id/stage via API_04)"
      dom_hierarchy: "@dnd-kit useSortable wrapper, DealCard(COM_11)"
      notes: "Wraps DealCard with @dnd-kit useSortable. Shows pending spinner overlay if dealId is in pendingTransitions map."

    - id: "COM_19"
      component_name: "PipelineStageColumn"
      classification: "Smart"
      props: "stage: PipelineStageBoardColumnDto, isOver: boolean"
      state_bindings: "usePipelineBoardStore.boardColumns[stageId]"
      api_dependency: "null"
      dom_hierarchy: "@dnd-kit useDroppable, PipelineStageColumnHeader(COM_12), DraggableDealCard(COM_18)[], EmptyStageState"
      notes: "Drop zone for a single pipeline stage. Renders DraggableDealCard list for its deals."

    - id: "COM_20"
      component_name: "PipelineBoardFilterBar"
      classification: "Smart"
      props: "currentUserRole: RoleEnum"
      state_bindings: "usePipelineBoardStore.activeFilters, usePipelineBoardStore.searchQuery"
      api_dependency: "null (filter changes trigger useDealsBoard re-fetch)"
      dom_hierarchy: "BoardSearchInput(COM_10), Shadcn Select (Stage, Rep), ValueRangeInputs, DateRangePickers, BoardFilterChip(COM_13)[]"
      notes: "Rep filter only rendered if role = MANAGER or ADMIN."

    - id: "COM_21"
      component_name: "CreateDealModal"
      classification: "Smart"
      props: "open: boolean, onClose: () => void, prefilledStageId: string | null"
      state_bindings: "null"
      api_dependency: "API_09 (duplicate check), API_01 (create deal)"
      dom_hierarchy: "Shadcn Dialog, DealFormFields(COM_14), DuplicateWarningBanner(COM_09), Shadcn Button (Submit/Cancel)"
      notes: "Calls API_09 on title+contact blur. Calls API_01 on confirmed submit. Invalidates useDealsBoard query on success."

    - id: "COM_22"
      component_name: "DealDetailEditPanel"
      classification: "Smart"
      props: "deal: DealDetailResponseDto, canEdit: boolean"
      state_bindings: "null (debounced PATCH on each field change)"
      api_dependency: "API_03 (PATCH /deals/:id)"
      dom_hierarchy: "DealFormFields(COM_14), StageTransitionDropdown(COM_15), LastEditedByIndicator"
      notes: "Each editable field fires PATCH /deals/:id after 1s debounce. Shows last-edited-by below panel."

    - id: "COM_23"
      component_name: "StageTransitionHistoryAccordion"
      classification: "Smart"
      props: "dealId: string"
      state_bindings: "null"
      api_dependency: "Transitions data from API_02 DealDetailResponseDto.stage_transitions"
      dom_hierarchy: "Shadcn Accordion, StageTransitionHistoryItem(COM_08)[] sorted desc by transitioned_at"
      notes: "Collapsed by default. Data from already-fetched DealDetailResponseDto — no additional API call."

    - id: "COM_24"
      component_name: "PipelineSummaryBarOrganism"
      classification: "Smart"
      props: "currentUserRole: RoleEnum, activeFilters: PipelineSummaryQueryDto"
      state_bindings: "usePipelineSummary TanStack Query (refetchInterval: 30000)"
      api_dependency: "API_08 (GET /deals/summary)"
      dom_hierarchy: "PipelineSummaryMetricCard(COM_16) x4, Recharts BarChart (value by stage), Shadcn Skeleton (loading)"
      notes: "Hidden if role = SALES_REP. Renders skeleton cards while loading."

    - id: "COM_25"
      component_name: "DealListTableOrganism"
      classification: "Smart"
      props: "currentUserRole: RoleEnum"
      state_bindings: "useDealsListView TanStack Query, URL search params for filters+pagination+sort"
      api_dependency: "API_06 (GET /deals), API_12 (bulk-reassign), API_13 (bulk-archive), API_10 + API_11 (export)"
      dom_hierarchy: "TanStack Table v8, DealListRowActions(COM_17), ExportButton(COM_07), BulkActionToolbar, Shadcn Pagination"
      notes: "Sort, filter, page reflected in URL query params. Bulk action toolbar rendered only when rows selected."

    - id: "COM_26"
      component_name: "ActivityTimelineSection"
      classification: "Smart"
      props: "dealId: string"
      state_bindings: "useActivitiesByDeal TanStack Query"
      api_dependency: "External Activity API: GET /activities?deal_id={id}"
      dom_hierarchy: "Activity list items (from Activity module DTOs), Shadcn Button (Log Activity)"
      notes: "Fetched independently from deal details. Slow load does not block deal header display."

- id: TIER-004
  title: "Templates"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - id: "COM_27"
      component_name: "PipelineBoardTemplate"
      classification: "Smart"
      props: "null"
      state_bindings: "usePipelineBoardStore (full), useDealsBoard TanStack Query"
      api_dependency: "API_07 (GET /deals/board)"
      dom_hierarchy: "@dnd-kit DndContext, PipelineBoardFilterBar(COM_20), PipelineStageColumn(COM_19)[] (one per stage), DragOverlay(DealCard COM_11), PipelineSummaryBarOrganism(COM_24)"
      notes: "Root board layout. DndContext onDragEnd dispatches optimistic Zustand update and PATCH API call. DragOverlay renders ghost card during drag."

    - id: "COM_28"
      component_name: "DealDetailTemplate"
      classification: "Smart"
      props: "dealId: string"
      state_bindings: "useDealDetail TanStack Query"
      api_dependency: "API_02 (GET /deals/:id), API_04 (PATCH /deals/:id/stage)"
      dom_hierarchy: "DealDetailHeader, DealDetailEditPanel(COM_22), ActivityTimelineSection(COM_26), StageTransitionHistoryAccordion(COM_23)"
      notes: "Fetches deal on mount. Skeleton shown during load. 404 redirect if deal not found."

    - id: "COM_29"
      component_name: "DealListTemplate"
      classification: "Smart"
      props: "null"
      state_bindings: "useDealsListView TanStack Query, URL params"
      api_dependency: "API_06, API_12, API_13, API_10, API_11"
      dom_hierarchy: "ListViewHeader (title, breadcrumb), DealListTableOrganism(COM_25)"
      notes: "Thin template wrapper providing page-level layout context for the table organism."

- id: TIER-005
  title: "Pages"
  requestVersion: "2026.04.06 21.00.00"
  version: "2026.04.06 21.00.00"
  parentVersion: "2026.04.06 21.00.00"
  items:
    - id: "COM_30"
      component_name: "DealsPage"
      classification: "Smart"
      props: "null"
      state_bindings: "null (delegates to PipelineBoardTemplate)"
      api_dependency: "null (template handles all fetching)"
      dom_hierarchy: "Next.js app/(dashboard)/deals/page.tsx → PipelineBoardTemplate(COM_27), CreateDealModal(COM_21)"
      notes: "Next.js App Router page.tsx. Protected by middleware JWT check. Renders board template + floating New Deal FAB."

    - id: "COM_31"
      component_name: "DealDetailPage"
      classification: "Smart"
      props: "params: { id: string }"
      state_bindings: "null (delegates to DealDetailTemplate)"
      api_dependency: "null (template handles all fetching)"
      dom_hierarchy: "Next.js app/(dashboard)/deals/[id]/page.tsx → DealDetailTemplate(COM_28)"
      notes: "Dynamic route. Passes UUID from URL params to DealDetailTemplate."

    - id: "COM_32"
      component_name: "DealListPage"
      classification: "Smart"
      props: "null"
      state_bindings: "null (delegates to DealListTemplate)"
      api_dependency: "null (template handles all fetching)"
      dom_hierarchy: "Next.js app/(dashboard)/deals/list/page.tsx → DealListTemplate(COM_29)"
      notes: "Separate list view route. Shares filter URL param schema with board for consistent deep-linking."
