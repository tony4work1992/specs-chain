{
  "module": "order",
  "domain_name": "Order",
  "summary": "Order domain for commercial order creation, item ownership, payment lifecycle, and cancellation rules.",
  "owner_module": "order",
  "bounded_context": {
    "name": "Order Management",
    "description": "Handles order creation, item ownership, payment lifecycle, and order-related read patterns."
  },
  "aggregate_roots": [
    {
      "name": "Order",
      "description": "Root entity that owns order lifecycle, totals, audit data, and order items."
    }
  ],
  "aggregate_root": {
    "name": "Order",
    "identity": "orderId",
    "description": "Aggregate root representing a commercial order and its payment lifecycle.",
    "fields": [
      {
        "name": "orderId",
        "type": "string",
        "description": "Primary identifier of the order aggregate."
      },
      {
        "name": "orderNumber",
        "type": "string",
        "description": "Human-readable unique order number generated by the system."
      },
      {
        "name": "projectId",
        "type": "string",
        "description": "Reference to the owning project aggregate."
      },
      {
        "name": "requestedByUserId",
        "type": "string",
        "description": "User that requested the order."
      },
      {
        "name": "status",
        "type": "OrderStatus",
        "description": "Current lifecycle state."
      },
      {
        "name": "currency",
        "type": "CurrencyCode",
        "description": "Currency applied to all monetary values in the order."
      },
      {
        "name": "totalAmount",
        "type": "Money",
        "description": "Calculated sum of all line totals."
      },
      {
        "name": "items",
        "type": "OrderItem[]",
        "description": "Ordered collection of line items."
      },
      {
        "name": "paymentReference",
        "type": "string?",
        "description": "External payment reference when paid."
      },
      {
        "name": "paidAt",
        "type": "datetime?",
        "description": "Timestamp when payment is confirmed."
      },
      {
        "name": "cancelReason",
        "type": "string?",
        "description": "Reason captured when the order is cancelled."
      },
      {
        "name": "createdAt",
        "type": "datetime",
        "description": "Creation timestamp."
      },
      {
        "name": "createdByUserId",
        "type": "string",
        "description": "Actor that created the order."
      },
      {
        "name": "updatedAt",
        "type": "datetime",
        "description": "Last update timestamp."
      },
      {
        "name": "updatedByUserId",
        "type": "string",
        "description": "Actor that last updated the order."
      }
    ]
  },
  "entities": [
    {
      "name": "Order",
      "type": "aggregate_root",
      "description": "Commercial order placed under an active project.",
      "fields": [
        {
          "name": "orderId",
          "type": "string",
          "required": true
        },
        {
          "name": "orderNumber",
          "type": "string",
          "required": true
        },
        {
          "name": "projectId",
          "type": "string",
          "required": true
        },
        {
          "name": "requestedByUserId",
          "type": "string",
          "required": true
        },
        {
          "name": "status",
          "type": "OrderStatus",
          "required": true
        },
        {
          "name": "currency",
          "type": "CurrencyCode",
          "required": true
        },
        {
          "name": "totalAmount",
          "type": "Money",
          "required": true
        },
        {
          "name": "paymentReference",
          "type": "string?",
          "required": false
        },
        {
          "name": "paidAt",
          "type": "datetime?",
          "required": false
        },
        {
          "name": "cancelReason",
          "type": "string?",
          "required": false
        },
        {
          "name": "createdAt",
          "type": "datetime",
          "required": true
        },
        {
          "name": "createdByUserId",
          "type": "string",
          "required": true
        },
        {
          "name": "updatedAt",
          "type": "datetime",
          "required": true
        },
        {
          "name": "updatedByUserId",
          "type": "string",
          "required": true
        }
      ],
      "behaviors": [
        "create",
        "recalculateTotal",
        "markPaid",
        "cancel"
      ],
      "internal_children": [
        "OrderItem"
      ]
    },
    {
      "name": "OrderItem",
      "type": "entity",
      "description": "Line item that belongs to the Order aggregate and cannot exist independently.",
      "fields": [
        {
          "name": "lineNo",
          "type": "integer",
          "required": true
        },
        {
          "name": "sku",
          "type": "string",
          "required": true
        },
        {
          "name": "name",
          "type": "string",
          "required": true
        },
        {
          "name": "quantity",
          "type": "integer",
          "required": true
        },
        {
          "name": "unitPrice",
          "type": "Money",
          "required": true
        },
        {
          "name": "lineTotal",
          "type": "Money",
          "required": true
        }
      ],
      "behaviors": [
        "create",
        "recalculateLineTotal"
      ],
      "internal_children": []
    }
  ],
  "value_objects": [
    {
      "name": "Money",
      "source": "../shared/common-value-objects.yaml",
      "rules": [
        "amountMinor must be an integer.",
        "currency must be present and supported by CurrencyCode."
      ]
    }
  ],
  "enums": [
    {
      "name": "OrderStatus",
      "values": [
        "PENDING_PAYMENT",
        "PAID",
        "CANCELLED"
      ]
    },
    {
      "name": "CurrencyCode",
      "source": "../shared/common-enums.yaml"
    }
  ],
  "relationships": [
    {
      "from": "Order",
      "to": "OrderItem",
      "type": "one-to-many",
      "ownership": "internal-aggregate",
      "navigation": "root-to-child"
    },
    {
      "from": "Order",
      "to": "Project",
      "type": "reference-by-id",
      "ownership": "external-module-reference",
      "navigation": "none"
    },
    {
      "from": "Order",
      "to": "User",
      "type": "reference-by-id",
      "ownership": "external-module-reference",
      "navigation": "none"
    }
  ],
  "ownership_rules": [
    "Order is owned by the order module.",
    "OrderItem cannot be created independently from Order.",
    "projectId is an external project-module reference only.",
    "requestedByUserId is an external user-module reference only.",
    "Project and user data must be resolved through reader ports rather than direct ORM navigation."
  ],
  "external_references": [
    {
      "field": "projectId",
      "note": "Reference to the owning project aggregate."
    },
    {
      "field": "requestedByUserId",
      "note": "User that requested the order."
    }
  ],
  "identifiers": {
    "strategy": "uuid",
    "fields": [
      "Order.orderId",
      "Order.orderNumber"
    ]
  },
  "auditing": {
    "enabled": true,
    "fields": [
      "createdAt",
      "updatedAt",
      "createdByUserId",
      "updatedByUserId"
    ]
  },
  "soft_delete": {
    "enabled": false,
    "field": ""
  },
  "persistence": {
    "database_type": "postgres",
    "tables": [
      "orders",
      "order_items"
    ],
    "indexes": [
      {
        "table": "orders",
        "fields": [
          "project_id",
          "status"
        ]
      },
      {
        "table": "orders",
        "fields": [
          "requested_by_user_id",
          "created_at"
        ]
      },
      {
        "table": "order_items",
        "fields": [
          "order_id",
          "line_no"
        ]
      }
    ],
    "unique_constraints": [
      {
        "table": "orders",
        "fields": [
          "order_number"
        ]
      },
      {
        "table": "order_items",
        "fields": [
          "order_id",
          "line_no"
        ]
      }
    ],
    "foreign_keys": [
      {
        "table": "order_items",
        "field": "order_id",
        "references": "orders.order_id"
      }
    ],
    "orm_notes": [
      "OrderOrmEntity may use a one-to-many relation to OrderItemOrmEntity inside the same module only.",
      "Project and User stay as id-only references; no direct ORM relation to external module entities.",
      "Money should be persisted as amount_minor + currency columns."
    ]
  },
  "repositories": [
    {
      "name": "OrderRepository",
      "aggregate": "Order",
      "methods": [
        "save",
        "getById(orderId)",
        "listByFilter",
        "findByOrderNumber",
        "existsByOrderNumber"
      ]
    }
  ],
  "cross_module_references": [
    {
      "local_entity": "Order",
      "field": "projectId",
      "target_module": "project",
      "target_concept": "Project",
      "reference_type": "id-only",
      "access_rule": "Use PROJECT_READER_PORT when project detail or status validation is needed."
    },
    {
      "local_entity": "Order",
      "field": "requestedByUserId",
      "target_module": "user",
      "target_concept": "User",
      "reference_type": "id-only",
      "access_rule": "Use USER_READER_PORT when requester detail or status validation is needed."
    }
  ],
  "query_patterns": [
    "get order detail by orderId",
    "list orders by projectId, status, and creation date",
    "search unpaid orders by projectId for finance follow-up"
  ],
  "security_and_visibility": [
    "Audit fields are internal and should not be exposed in every response by default.",
    "cancelReason should only appear when the order is cancelled and the viewer has permission to see cancellation context.",
    "Internal persistence columns such as amount_minor should not leak directly into response DTOs."
  ],
  "notes": [
    "Keep ORM relations minimal and internal to the aggregate.",
    "Prefer id-only references to project and user modules.",
    "Domain entities should not include NestJS or TypeORM decorators."
  ],
  "expected_generated_files": [
    "modules/order/domain/entities/order.entity.ts",
    "modules/order/domain/entities/order-item.entity.ts",
    "modules/order/domain/enums/order-status.enum.ts",
    "modules/order/domain/repositories/order.repository.interface.ts",
    "modules/order/infrastructure/persistence/typeorm/entities/order.orm-entity.ts",
    "modules/order/infrastructure/persistence/typeorm/entities/order-item.orm-entity.ts",
    "modules/order/infrastructure/persistence/typeorm/repositories/order.repository.impl.ts"
  ],
  "persistence_assumptions": [
    "Store order header and order items in separate tables under the order module schema.",
    "Persist money as amount_minor + currency to avoid floating-point drift.",
    "Do not duplicate project or user entities; keep only their identifiers."
  ]
}
