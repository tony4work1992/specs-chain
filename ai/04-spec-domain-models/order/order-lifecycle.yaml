{
  "module": "order",
  "domain_name": "Order",
  "entity": "Order",
  "states": [
    "PENDING_PAYMENT",
    "PAID",
    "CANCELLED"
  ],
  "rules": [
    "New orders always start in PENDING_PAYMENT.",
    "Only PENDING_PAYMENT orders can transition to PAID.",
    "Only PENDING_PAYMENT orders can transition to CANCELLED.",
    "PAID and CANCELLED are terminal states."
  ],
  "transitions": [
    {
      "from": "PENDING_PAYMENT",
      "to": "PAID"
    },
    {
      "from": "PENDING_PAYMENT",
      "to": "CANCELLED"
    }
  ],
  "forbidden_transitions": [
    {
      "from": "PAID",
      "to": "CANCELLED"
    },
    {
      "from": "CANCELLED",
      "to": "PAID"
    }
  ]
}
