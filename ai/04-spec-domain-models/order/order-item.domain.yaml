{
  "owner_module": "order",
  "entity": "OrderItem",
  "entity_type": "entity",
  "parent": "Order",
  "description": "Immutable line item stored inside an order aggregate.",
  "fields": [
    {
      "name": "lineNo",
      "type": "integer",
      "required": true,
      "description": "Line number within the order."
    },
    {
      "name": "sku",
      "type": "string",
      "required": true,
      "description": "Commercial item code."
    },
    {
      "name": "name",
      "type": "string",
      "required": true,
      "description": "Line item display name."
    },
    {
      "name": "quantity",
      "type": "integer",
      "required": true,
      "description": "Requested quantity, must be greater than zero."
    },
    {
      "name": "unitPrice",
      "type": "Money",
      "required": true,
      "description": "Price per unit."
    },
    {
      "name": "lineTotal",
      "type": "Money",
      "required": true,
      "description": "Derived value quantity x unit price."
    }
  ],
  "behaviors": [
    "create",
    "recalculateLineTotal"
  ],
  "relationships": [
    {
      "from": "Order",
      "to": "OrderItem",
      "type": "one-to-many",
      "ownership": "internal-aggregate",
      "navigation": "root-to-child"
    }
  ],
  "ownership_rules": [
    "OrderItem belongs to the Order aggregate.",
    "OrderItem cannot be created, updated, or deleted independently from Order."
  ],
  "identifiers": {
    "strategy": "aggregate-scoped",
    "fields": [
      "OrderItem.lineNo"
    ]
  },
  "persistence_notes": [
    "OrderItem is stored in the order module schema.",
    "The persistence model should enforce uniqueness of order_id + line_no."
  ],
  "rules": [
    "lineTotal is derived and never sent independently by the client.",
    "sku + lineNo must be unique within one order."
  ]
}
