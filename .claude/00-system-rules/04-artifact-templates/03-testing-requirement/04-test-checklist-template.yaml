$schema: http://json-schema.org/draft-07/schema#
title: Checklist Item Array Schema
type: array
items:
  type: object
  required:
    - code
    - type
    - item
    - description
    - requestVersion
    - version
    - parentVersion
  properties:
    code:
      type: string
      pattern: ^CHE-\d{6}$
      description: Unique identifier for the checklist item (e.g., CHE-000001)
    type:
      type: string
      enum:
        - Scope
        - Impact
      description: Type of inspection
    item:
      type: string
      description: Item name or linked Scope code
    description:
      type: string
      description: Detailed description of the content to be inspected
    requestVersion:
      type: string
      pattern: ^\d{4}\.\d{2}\.\d{2} \d{2}\.\d{2}\.\d{2}$
      description: Version of the request (e.g., 2026.04.02 11.30.00)
    version:
      type: string
      pattern: ^\d{4}\.\d{2}\.\d{2} \d{2}\.\d{2}\.\d{2}$
      description: Version of the current document (e.g., 2026.04.02 11.30.00)
    parentVersion:
      type: string
      pattern: ^\d{4}\.\d{2}\.\d{2} \d{2}\.\d{2}\.\d{2}$
      description: Version of the parent document used as source (e.g., 2026.04.02 11.30.00)
