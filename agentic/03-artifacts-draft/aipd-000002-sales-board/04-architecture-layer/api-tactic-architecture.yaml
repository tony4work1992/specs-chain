- id: SLICE_01
  module_name: Export Module
  requestVersion: 2026.04.03 14.29.29
  version: 2026.04.03 14.29.29
  parentVersion: 2026.04.03 13.56.27
  items:
    - layer: Presentation
      file_name: export.controller.ts
      responsibility: >-
        Exposes `/api/v1/export/pdf`. Applies `JwtAuthGuard` & `ThrottlerGuard`. Injects incoming payload into the
        CommandBus.
      dependencies: ExportPdfCommand
    - layer: Application
      file_name: dto/export-pdf.dto.ts
      responsibility: Class-validator definition mapping `temporalMode`, `startDate`, `endDate`. Enforces 365-day gap rule natively.
      dependencies: None
    - layer: Application
      file_name: export-pdf.command-handler.ts
      responsibility: >-
        Executes domain logic. Fetches exact metrics from Repository, transforms data, dispatches RPC call to Puppeteer
        Worker Interface.
      dependencies: ISalesRepository, IPuppeteerWorkerService
    - layer: Infrastructure
      file_name: puppeteer-worker.service.ts
      responsibility: Implements `IPuppeteerWorkerService`. Dispatches gRPC request to K8s Puppeteer pod and awaits signed AWS URL.
      dependencies: gRPC Client
- id: SLICE_02
  module_name: Dashboard Metrics Module
  requestVersion: 2026.04.03 14.29.29
  version: 2026.04.03 14.29.29
  parentVersion: 2026.04.03 13.56.27
  items:
    - layer: Presentation
      file_name: dashboard-metrics.controller.ts
      responsibility: Exposes `/api/v1/dashboard/metrics`. Intercepts Cache via `RedisInterceptor`. Extracts `req.user.id`.
      dependencies: GetMetricsQuery
    - layer: Application
      file_name: get-metrics.query-handler.ts
      responsibility: Fetches pre-calculated cache. If miss, calls Repository. Resolves to JSON Array.
      dependencies: ISalesRepository, ICacheService
    - layer: Infrastructure/Persistence
      file_name: mongo-sales.repository.ts
      responsibility: >-
        Implements `ISalesRepository`. Executes `$dateTrunc` MongoDB aggregation pipeline injected with client timezone
        offset.
      dependencies: MongooseConnection
- id: SLICE_03
  module_name: Background Poller Module
  requestVersion: 2026.04.03 14.29.29
  version: 2026.04.03 14.29.29
  parentVersion: 2026.04.03 13.56.27
  items:
    - layer: Presentation/Adapter
      file_name: crm-cron.adapter.ts
      responsibility: Binds to `@Cron('*/5 * * * *')`. Initiates synchronizer task.
      dependencies: SyncSalesDataCommand
    - layer: Application
      file_name: sync-sales.command-handler.ts
      responsibility: >-
        Requests delta from `ICrmWebHookService`. Pushes array to `ISalesRepository`. Emits
        `sync.completed.invalidate_cache` event.
      dependencies: ICrmWebHookService, ISalesRepository, EventPublisher
    - layer: Infrastructure
      file_name: redis-invalidation.event-listener.ts
      responsibility: Listens for `sync.completed.invalidate_cache`. Executes `SCAN 0 ... UNLINK` logic over the Redis cluster.
      dependencies: RedisClient
