- code: AFI-000001
  index: 1
  criteria: Does a strict Cache Invalidation logic exist between the NestJS Cron Poller and the Redis Cache Cluster?
  pass: false
  hint: Identify how Redis drops stale Dashboard aggregates when the 5-minute MongoDB delta sync completes.
  placeholder: >-
    e.g., Poller fires an EventBus trigger upon successful Mongo upsert, prompting Redis to surgically invalidate
    `sales:aggregate:*` keys.
  references:
    - info: >-
        FRD assumes data is fresh within 5 minutes, but Redis keys will serve permanently stale data an unbounded TTL
        unless explicitly invalidated after DB writes.
      source: Functional Requirement Document.md (Section 5.1 & 8.2)
  additional_info: Without this logic, users will see completely frozen data despite background syncs succeeding.
  requestVersion: 2026.04.03 13.27.06
  version: 2026.04.03 13.27.06
  parentVersion: 2026.04.03 13.25.24
- code: AFI-000002
  index: 2
  criteria: How does the React UI handle asynchronous UI state Race Conditions during excessive Puppeteer Export operations?
  pass: false
  hint: >-
    Define the UI blocking state or AbortController mechanism if a user changes the Temporal dropdown while an existing
    PDF request is pending.
  placeholder: >-
    e.g., React UI completely locks the Temporal dropdown and displays a loading overlay on the Export button until the
    original RPC response concludes.
  references:
    - info: >-
        If the user modifies the Dashboard scope to 'Yearly' abruptly while a 'Monthly' PDF is generating, the eventual
        downloaded PDF will conflict with the visual UI context.
      source: Functional Requirement Document.md (Section 5.1 & 5.2)
  additional_info: >-
    Puppeteer operations can take up to 10 seconds (per FRD NFRs). 10 seconds is ample time for a user to invoke a state
    collision.
  requestVersion: 2026.04.03 13.27.06
  version: 2026.04.03 13.27.06
  parentVersion: 2026.04.03 13.25.24
- code: AFI-000003
  index: 3
  criteria: >-
    Are there explicit DOM Density constraints (Aggregation buckets) for rendering the Recharts Distribution graphs
    across wide temporal spans?
  pass: false
  hint: Formulate a rule mapping large temporal scopes to grouped X-axis buckets to prevent browser freeze.
  placeholder: >-
    e.g., If temporal scope = Annually, backend must automatically group `$sum` by Month (12 columns). If scope =
    Monthly, group by Day (30 columns).
  references:
    - info: >-
        Rendering 365 daily columns into an SVG via Recharts for a 'Yearly' span will likely cause Client-side UI
        freezing and unreadable layouts.
      source: Functional Requirement Document.md (Section 5.3 & 9.2)
  additional_info: >-
    This mathematical UI logic must be baked into the Backend payload to avoid forcing the Frontend to perform heavy
    map-reduce looping in the main browser thread.
  requestVersion: 2026.04.03 13.27.06
  version: 2026.04.03 13.27.06
  parentVersion: 2026.04.03 13.25.24
