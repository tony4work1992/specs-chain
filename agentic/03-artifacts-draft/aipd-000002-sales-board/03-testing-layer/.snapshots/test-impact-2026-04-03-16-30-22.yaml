- code: IMP-000001
  systemName: Global CRM Front-End
  componentName: UI Item
  elementName: Shared Date Picker Context
  description: >-
    REGRESSION RISK (Frontend Layer): The new Temporal Date Toggle injects normalized UTC 00:00:00Z boundaries into
    Redux/React Context. This might override and corrupt legacy Local-Timezone date pickers used in the existing 'Leads
    Management' module.
  requestVersion: 2026.04.03 12.09.06
  version: 2026.04.03 12.09.06
  parentVersion: 2026.04.03 12.04.48
- code: IMP-000002
  systemName: Main API Gateway
  componentName: API
  elementName: Nginx Connection Limit
  description: >-
    REGRESSION RISK (Backend Layer): Persistent SSE WebSockets (/api/v1/dashboard/stream) hold TCP connections forever.
    If 10,000 agents open the Dashboard, the Nginx worker limit `worker_connections` could be exhausted, causing legacy
    REST APIs (e.g. Billing) to fail with HTTP 502 Bad Gateway.
  requestVersion: 2026.04.03 12.09.06
  version: 2026.04.03 12.09.06
  parentVersion: 2026.04.03 12.04.48
- code: IMP-000003
  systemName: Core Database Cluster
  componentName: API
  elementName: MongoDB Bookings Collection Lock
  description: >-
    REGRESSION RISK (Persistence Layer): The new Cron Poller runs aggressively `*/5 * * * *` to purge ghost records
    (Hard Deletes) via batch `$pull`. This could invoke Collection/Document locks, triggering WriteTimeouts for the Core
    CRM App trying to insert live deals simultaneously.
  requestVersion: 2026.04.03 12.09.06
  version: 2026.04.03 12.09.06
  parentVersion: 2026.04.03 12.04.48
- code: IMP-000004
  systemName: Redis Caching Layer
  componentName: API
  elementName: Redis Memory Eviction
  description: >-
    REGRESSION RISK (Persistence Layer): Huge serialized JSON Metric payloads pushed to Redis without proper TTL could
    rapidly invoke `volatile-lru` eviction policies, accidentally purging critical Session Tokens used globally by the
    Authentication System.
  requestVersion: 2026.04.03 12.09.06
  version: 2026.04.03 12.09.06
  parentVersion: 2026.04.03 12.04.48
- code: IMP-000005
  systemName: Puppeteer Worker Node
  componentName: API
  elementName: Shared Kubernetes CPU Throttling
  description: >-
    REGRESSION RISK (Infrastructure Layer): PDF Export via Chromium is extremely CPU-heavy. If the `node:alpine` task
    isn't rigorously bound with cgroup CPU quota limits (e.g., `requests.cpu`), it will siphon resources from shared
    nodes and degrade performance of all adjacent microservices.
  requestVersion: 2026.04.03 12.09.06
  version: 2026.04.03 12.09.06
  parentVersion: 2026.04.03 12.04.48
