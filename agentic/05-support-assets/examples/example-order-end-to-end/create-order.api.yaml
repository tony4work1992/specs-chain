{
  "api_spec": {
    "id": "ORD-F001",
    "module": "order",
    "feature": "create-order",
    "summary": "Create a new order for an active project.",
    "endpoint": {
      "method": "POST",
      "path": "/api/orders"
    },
    "request_schema": {
      "fields": [
        {
          "name": "projectId",
          "type": "string",
          "description": "Target project identifier."
        },
        {
          "name": "requestedByUserId",
          "type": "string",
          "description": "User requesting the order."
        },
        {
          "name": "currency",
          "type": "CurrencyCode",
          "description": "Commercial currency for the order."
        },
        {
          "name": "items",
          "type": "array<OrderItemInput>",
          "description": "Line items with sku, name, quantity, and unit price."
        },
        {
          "name": "note",
          "type": "string?",
          "description": "Optional commercial note."
        }
      ]
    },
    "response_schema": {
      "fields": [
        {
          "name": "orderId",
          "type": "string",
          "description": "Generated aggregate identifier."
        },
        {
          "name": "orderNumber",
          "type": "string",
          "description": "Generated business number."
        },
        {
          "name": "status",
          "type": "OrderStatus",
          "description": "Initial lifecycle state PENDING_PAYMENT."
        },
        {
          "name": "totalAmount",
          "type": "Money",
          "description": "Calculated total amount."
        },
        {
          "name": "createdAt",
          "type": "datetime",
          "description": "Creation timestamp."
        }
      ]
    },
    "validation_rules": [
      "projectId and requestedByUserId are required.",
      "items must contain at least one element.",
      "quantity must be an integer greater than zero.",
      "unitPrice.amountMinor must be greater than zero.",
      "All items must use the same currency as the order currency."
    ],
    "business_rules": [
      "Order total is derived from item quantities and unit prices.",
      "The requester must be an ACTIVE user.",
      "The project must allow commercial ordering."
    ],
    "process_flow": [
      "Validate request payload and normalize money fields.",
      "Read project and user context via reader ports.",
      "Instantiate Order aggregate with calculated totals.",
      "Persist the aggregate and return the created summary."
    ],
    "cross_module_interactions": [
      {
        "contract": "ProjectReaderPort",
        "target": "project",
        "purpose": "Validate project existence and status."
      },
      {
        "contract": "UserReaderPort",
        "target": "user",
        "purpose": "Validate requester existence and status."
      }
    ],
    "errors": [
      {
        "code": "PROJECT_NOT_FOUND",
        "http_status": "404",
        "meaning": "Project does not exist."
      },
      {
        "code": "USER_NOT_FOUND",
        "http_status": "404",
        "meaning": "Requester does not exist."
      },
      {
        "code": "INVALID_ORDER_ITEM",
        "http_status": "422",
        "meaning": "One or more line items violate quantity or price rules."
      }
    ],
    "test_coverage": [
      "06-spec-testing/01-unit-tests/order/create-order.unit-test.yaml",
      "06-spec-testing/02-integration-tests/order/create-order.integration-test.yaml",
      "06-spec-testing/03-end-to-end-tests/order/create-order.e2e-test.yaml"
    ]
  }
}
