$schema: http://json-schema.org/draft-07/schema#
title: Criteria Evaluation
type: array
properties:
  code:
    type: string
    pattern: ^INF-\d{6}$
    description: Unique identifier code for the criteria (e.g., INF-000001)
  index:
    type: integer
    description: The sequential index of the criteria
  criteria:
    type: string
    description: The description of the criteria to be evaluated
  pass:
    type: boolean
    description: Indicates whether the criteria has passed or failed
  hint:
    type: string
    description: A hint or instruction explaining how to meet the criteria
  placeholder:
    type: string
    description: Placeholder text for user input
  references:
    type: array
    description: List of references related to the criteria
    items:
      type: object
      properties:
        info:
          type: string
          description: Information or description of the reference
        source:
          type: string
          description: Source of the reference, such as a document section
      required:
        - info
        - source
      additionalProperties: false
  additional_info:
    type: string
    description: Any additional information or comments
  requestVersion:
    type: string
    pattern: ^\d{4}\.\d{2}\.\d{2} \d{2}\.\d{2}\.\d{2}$
    description: Version of the request (e.g., 2026.04.02 11.30.00)
  version:
    type: string
    pattern: ^\d{4}\.\d{2}\.\d{2} \d{2}\.\d{2}\.\d{2}$
    description: Version of the current document (e.g., 2026.04.02 11.30.00)
  parentVersion:
    type: string
    pattern: ^\d{4}\.\d{2}\.\d{2} \d{2}\.\d{2}\.\d{2}$
    description: Version of the parent document used as source (e.g., 2026.04.02 11.30.00)
required:
  - code
  - index
  - criteria
  - pass
  - hint
  - placeholder
  - references
  - additional_info
  - requestVersion
  - version
  - parentVersion
additionalProperties: false
